<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="LTC Phone">
<title>LTC Phone</title>
<link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48">
<link rel="icon" type="image/png" href="/icon-192.png" sizes="192x192">
<link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180">
<meta name="theme-color" content="#070605">
<style>
@font-face{font-family:"Playfair Display";font-weight:900;font-style:normal;font-display:swap;src:url(/brand/PlayfairDisplay-900.woff2) format("woff2")}
@font-face{font-family:"Cinzel";font-weight:700;font-style:normal;font-display:swap;src:url(/brand/Cinzel-700.woff2) format("woff2")}
@font-face{font-family:"Inter";font-weight:400;font-style:normal;font-display:swap;src:url(/brand/Inter-400.woff2) format("woff2")}
@font-face{font-family:"Inter";font-weight:700;font-style:normal;font-display:swap;src:url(/brand/Inter-700.woff2) format("woff2")}
@font-face{font-family:"Inter";font-weight:800;font-style:normal;font-display:swap;src:url(/brand/Inter-800.woff2) format("woff2")}
/* Layout: one-screen shell. Top strip, a 30px status line, one scrolling panel
   (the confirm bar is an overlay on its bottom edge), the tab bar, then the
   master DISARM bar pinned last. Nothing in the shell changes size with state. */
:root{
  color-scheme:dark;
  --bg:#070605; --panel:#15110d; --panel2:#1f1a14; --bronze:#2C2418; --line:#4a3f2e;
  --gold:#D4A84A; --champagne:#F6E3AE; --cream:#EFE3C6; --muted:#B99B5C;
  --green:#28BE5A; --green-ink:#04150a; --amber:#F5A01E; --amber-ink:#1e1000;
  --red:#E61E18; --red-hi:#FF5A50; --red-deep:#9E1016; --white:#fff;
  --sans:"Inter",-apple-system,"Segoe UI",system-ui,sans-serif;
  --serif:"Playfair Display",Georgia,serif;
  --caps:"Cinzel","Trajan Pro",Georgia,serif;
  --gl:max(16px, env(safe-area-inset-left, 0px)); --gr:max(16px, env(safe-area-inset-right, 0px));
  --tap:3.5rem; --r:10px;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0;overflow-x:hidden}
html{font-size:16px;-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--cream);font-family:var(--sans);font-size:1rem;
  font-variant-numeric:tabular-nums lining-nums;overflow:hidden;touch-action:pan-y;
  -webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;border:0;background:none;margin:0;padding:0;cursor:pointer;touch-action:manipulation;text-align:center}
button:focus-visible{outline:3px solid var(--champagne);outline-offset:2px}
button:disabled{opacity:.35;cursor:default}
input{font:inherit}
#app{height:100%;max-width:520px;margin:0 auto;display:grid;grid-template:"top" auto "link" 30px "main" minmax(0,1fr) "tabs" auto "master" auto / minmax(0,1fr);overflow:hidden}

#top{grid-area:top;display:flex;align-items:center;gap:10px;padding:8px var(--gr) 8px var(--gl);background:var(--panel);min-width:0}
#top img{height:34px;width:auto;flex:none}
#top .st{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.1;overflow:hidden}
.cap{font-family:var(--caps);font-weight:700;letter-spacing:.14em;font-size:.6875rem;color:var(--gold);text-transform:uppercase}
#top .st span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#top .clk{font-weight:800;font-size:clamp(1.125rem,6vw,1.5rem);color:var(--champagne)}
.pill{flex:none;font-weight:800;font-size:.8125rem;letter-spacing:.04em;padding:6px 10px;border-radius:99px;background:var(--bronze);color:var(--champagne);white-space:nowrap}
.pill.on{background:var(--green);color:var(--green-ink)}
.pill.warn{background:var(--amber);color:var(--amber-ink)}
#gear{flex:none;width:44px;height:44px;border-radius:var(--r);border:1px solid var(--line);display:grid;place-items:center}
#gear.out{border-color:var(--gold);box-shadow:inset 0 0 0 2px var(--gold)}
#gear svg{width:22px;height:22px;stroke:var(--gold);fill:none;stroke-width:2}

#link{grid-area:link;position:relative;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:0 var(--gr) 0 var(--gl);height:30px;font-weight:800;font-size:.875rem;letter-spacing:.08em;border-bottom:1px solid var(--line);white-space:nowrap;z-index:5}
#link.ok{background:var(--panel2);color:var(--muted)}
#link i{display:inline-block;width:8px;height:8px;border-radius:50%;background:currentColor;margin-right:8px}
#link.slow{background:var(--amber);color:var(--amber-ink)}
#link.lost{background:var(--red);color:var(--white)}
#alerts{flex:none;height:22px;line-height:22px;white-space:nowrap;overflow:visible;margin:0;padding:0 10px;border-radius:var(--r);font-weight:800;font-size:.8125rem;letter-spacing:.06em;min-width:44px;position:relative;z-index:6}
.card:not(.all) .nm,.un{text-transform:capitalize}
#alerts::after{content:"";position:absolute;inset:-11px 0}
.hd.in{padding:0;flex:1;min-width:0}
#alerts.fault{background:var(--red);color:var(--white);box-shadow:0 0 0 2px var(--white)}
#alerts.warning{background:var(--amber);color:var(--amber-ink);box-shadow:0 0 0 2px var(--amber-ink)}
#link.lost #alerts{box-shadow:0 0 0 2px var(--white)}

#mainw{grid-area:main;position:relative;min-height:0;min-width:0}
#main{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;touch-action:pan-y;overscroll-behavior:contain;padding:12px var(--gr) 120px var(--gl);display:flex;flex-direction:column;gap:12px}
#main>*{flex:none;min-width:0}
#main>.show{flex:1 0 auto;padding-bottom:0}
#main.stale .card,#main.stale .hero,#main.stale>.seg{filter:saturate(.25) brightness(.8)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:0;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.seg button{min-height:var(--tap);font-weight:800;font-size:.9375rem;letter-spacing:.03em;background:var(--panel);color:var(--muted);border-left:1px solid var(--line);padding:0 4px;overflow-wrap:anywhere}
.seg button:first-child{border-left:0}
.seg button small{display:block;font-size:.6875rem;font-weight:700;opacity:.85}
.seg .sel{background:var(--bronze);color:var(--champagne);box-shadow:inset 0 -3px 0 var(--gold)}
.seg .armed{background:var(--green);color:var(--green-ink)}
.seg .safe{background:var(--bronze);color:var(--champagne);box-shadow:inset 0 0 0 2px var(--gold)}
.seg .locked{background:var(--amber);color:var(--amber-ink)}
.seg .wait{background:var(--bronze);color:var(--amber);box-shadow:inset 0 0 0 2px var(--amber)}
.seg .noans{background:var(--amber);color:var(--amber-ink)}
.seg .partlock{color:var(--amber);box-shadow:inset 0 0 0 2px var(--amber)}
.seg .unk{color:var(--amber)}
.seg button:disabled.armed,.seg button:disabled.locked,.seg button:disabled.wait,.seg button:disabled.unk,.seg button:disabled.safe{opacity:1}
.seg .asking{box-shadow:inset 0 0 0 3px var(--gold)}
.seg.sm button{min-height:2.875rem;font-size:.8125rem}
.seg.sm .sel{box-shadow:none}

.card{border:1px solid var(--line);border-radius:var(--r);background:var(--panel);display:flex;flex-direction:column;min-width:0}
.card.all{border:2px solid var(--gold);background:var(--bronze)}
.card.all>.hd{background:linear-gradient(#F0CF7A,#C9953A);border-radius:7px 7px 0 0;margin-bottom:12px;padding:8px 12px}
.card.all .nm{font-family:var(--caps);font-weight:700;letter-spacing:.16em;font-size:.9375rem;text-transform:uppercase}
.card.all>.hd .nm{color:var(--bg)}
.card.all>.seg button{min-height:4.25rem;font-size:1.0625rem;background:var(--bg)}
.card.all>.seg .armed{background:var(--green)} .card.all>.seg .locked{background:var(--amber)} .card.all>.seg .safe{background:var(--panel2)}
.card.all>.seg .noans{background:var(--amber)}
.card.all>.row .btn{min-height:4rem;background:var(--bg)} .card.all>.row .btn.amber{background:var(--amber)}
.hd{display:flex;align-items:center;gap:8px;padding:10px 12px 8px;min-height:44px;width:100%;text-align:left}
.hd .nm{flex:1;min-width:0;font-weight:800;font-size:1.125rem;color:var(--champagne);overflow-wrap:anywhere}
.hd .chev{flex:none;width:22px;height:22px;stroke:var(--gold);fill:none;stroke-width:2.5;transition:transform .15s}
.open>.hd .chev{transform:rotate(180deg)}
.hd .pill{font-size:.6875rem;padding:4px 8px}
.card>.seg,.card>.lv{margin:0 12px 12px}
.units{border-top:1px solid var(--line);padding:10px 12px;display:flex;flex-direction:column;gap:10px;background:var(--panel2);border-radius:0 0 var(--r) var(--r)}
.unit{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;align-items:center}
.unit .un{font-weight:700;font-size:.9375rem;overflow-wrap:anywhere;min-width:0}
.unit.lk .un{color:var(--amber)}

.lv{display:grid;grid-template-columns:var(--tap) minmax(0,1fr) var(--tap);gap:8px;align-items:center}
.lv .cap{grid-column:1/-1}
.lv+.lv{margin-top:-4px}
.lv .val{text-align:center;font-weight:800;font-size:clamp(1rem,7vw,1.5rem);color:var(--champagne);min-width:0}
.lv .val.small{font-size:1rem}
.lv .bar{grid-column:1/-1;height:6px;border-radius:3px;background:var(--bronze);overflow:hidden}
.lv .bar i{display:block;height:100%;background:var(--gold)}
.step{height:var(--tap);min-width:0;border-radius:var(--r);background:var(--bronze);border:1px solid var(--line);font-weight:800;font-size:1.75rem;color:var(--champagne)}
.step:active,.btn:active,.seg button:active{filter:brightness(1.3)}

.btn{min-height:var(--tap);border-radius:var(--r);font-weight:800;font-size:1rem;letter-spacing:.03em;padding:0 12px;background:var(--bronze);color:var(--champagne);border:1px solid var(--line);overflow-wrap:anywhere}
.btn small{display:block;font-size:.6875rem;font-weight:700}
.btn.green{background:var(--green);color:var(--green-ink);border-color:var(--green)}
.btn.amber{background:var(--amber);color:var(--amber-ink);border-color:var(--amber)}
.btn.red{background:var(--red);color:var(--white);border-color:var(--red)}
.btn.gold{background:linear-gradient(#F0CF7A,#C9953A);color:var(--bg);border-color:#C9953A}
.row{display:flex;align-items:center;gap:10px}
.row .nm{flex:1;min-width:0;font-weight:800;font-size:1.0625rem;color:var(--champagne);overflow-wrap:anywhere}
.row .btn{flex:none;min-width:6.5rem;max-width:45%}
.card>.row{padding:10px 12px}
h2{margin:6px 0 -4px;font-family:var(--caps);font-weight:700;font-size:.8125rem;letter-spacing:.2em;color:var(--gold);display:flex;align-items:center;gap:10px}
h2::after{content:"";flex:1;height:1px;background:var(--line)}
.none{font-family:var(--caps);font-weight:700;letter-spacing:.2em;color:var(--muted);text-align:center;padding:16px 0}

.show{display:flex;flex-direction:column;gap:14px;justify-content:space-between;min-height:min-content}
.hero{text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center;padding-top:8px;min-width:0;width:100%}
.hero .cap{font-size:.8125rem;letter-spacing:.3em;overflow-wrap:anywhere}
.hero .big{font-weight:800;font-size:clamp(2rem,17vw,6.5rem);line-height:1;color:var(--champagne);letter-spacing:-.02em;max-width:100%}
.hero .big.live{color:var(--green)} .hero .big.held{color:var(--amber)}
.hero .name{font-family:var(--serif);font-weight:900;font-size:1.375rem;color:var(--champagne);text-wrap:balance;overflow-wrap:anywhere;min-height:1.6em;max-width:100%}
.prog{width:100%;height:8px;border-radius:4px;background:var(--bronze);overflow:hidden}
.prog i{display:block;height:100%;background:var(--green)}
.of{font-weight:700;color:var(--muted);font-size:.9375rem}
.times{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.times span{font-weight:700;font-size:.9375rem;padding:6px 12px;border-radius:99px;border:1px solid var(--line);color:var(--muted)}
.times .nx{border-color:var(--gold);color:var(--champagne)}
.times .rn{border-color:var(--green);color:var(--green)}
.times .dn{opacity:.45;text-decoration:line-through}
.transport{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.transport .btn{min-height:5.25rem;font-size:1.0625rem;padding:0 4px;letter-spacing:0}
.hero .cap.bad{color:var(--red-hi)} .hero .cap.good{color:var(--green)}
.hero .big.chkw{font-size:clamp(2.1rem,12vw,3.75rem);color:var(--amber);letter-spacing:.02em;padding:14px 0}
.prog.chk{height:12px;border-radius:6px}
.prog.chk i{background:var(--amber)}
.checks{list-style:none;margin:4px 0 0;padding:0;width:100%;border:1px solid var(--line);border-radius:var(--r);background:var(--panel);text-align:left}
.checks li{display:flex;align-items:center;gap:10px;padding:9px 12px;border-top:1px solid var(--line);font-size:1rem;min-width:0}
.checks li:first-child{border-top:0}
.checks b{flex:1;min-width:0;font-weight:700;overflow-wrap:anywhere}
.checks svg{flex:none;width:20px;height:20px;fill:none;stroke-width:3.5;stroke:var(--green)}
.checks svg.no{stroke:var(--red-hi)} .checks svg.wn{stroke:var(--amber)}
.checks li.no{background:rgba(230,30,24,.14)} .checks li.no b{color:var(--white);font-weight:800}
.checks li.wn b{color:var(--amber)}
.checks li span{flex:none;max-width:45%;font-weight:800;font-size:.8125rem;color:var(--red-hi);letter-spacing:.03em;overflow-wrap:anywhere}
.checks li.wn span{color:var(--amber)}
.tw{display:flex;flex-direction:column;gap:10px}
.btn.wide{min-height:4rem;font-size:1.125rem}

/* the confirm bar: an overlay on the bottom edge of the panel, never part of the flow */
#mainw>#sheet{position:absolute;left:0;right:0;bottom:0;z-index:8;padding:12px var(--gr) 10px var(--gl);background:var(--panel2);border-top:2px solid var(--gold);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center}
#mainw>#sheet[hidden]{display:none}
#sheet .what{grid-column:1/-1;font-weight:800;font-size:1.0625rem;color:var(--champagne);overflow-wrap:anywhere}
#sheet .btn{min-height:4rem;font-size:1.25rem}
#sheet .x{min-width:4rem}
#sheet .t{position:absolute;left:0;top:-2px;height:2px;background:var(--bg);right:0;transform-origin:right}
#sheet.line{background:var(--red-deep);border-top-color:var(--red-hi);display:block;padding:0}
#sheet.line.warn{background:#5a3a00;border-top-color:var(--amber)}
#sheet.line.ok{background:#0c3a1c;border-top-color:var(--green)}
#sheet .ln{display:block;width:100%;min-height:44px;max-height:calc(3 * 1.35em + 24px);overflow-y:auto;padding:12px var(--gr) 12px var(--gl);text-align:left;font-weight:700;font-size:.9375rem;line-height:1.35;color:var(--white);overflow-wrap:anywhere;user-select:text}

#tabs{grid-area:tabs;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:1px solid var(--line);background:var(--panel);padding:0 var(--gr) 0 var(--gl)}
#tabs button{min-height:3.25rem;font-family:var(--caps);font-weight:700;font-size:min(.75rem,3.3vw);letter-spacing:.06em;color:var(--muted);border-top:3px solid transparent;min-width:0}
#tabs .sel{color:var(--champagne);border-top-color:var(--gold)}
#masterw{grid-area:master;padding:8px var(--gr) max(10px, env(safe-area-inset-bottom, 0px)) var(--gl);background:var(--panel)}
#master{width:100%;min-height:4.25rem;border-radius:var(--r);background:var(--red);color:var(--white);font-weight:800;font-size:1.375rem;letter-spacing:.06em;border:2px solid #ff8a80}
#master.long{font-size:1rem;letter-spacing:.02em}
#master:active{background:var(--red-deep)}
#master.done{background:var(--bronze);border-color:var(--gold);color:var(--champagne)}
#master.send{background:var(--red-deep);border-color:var(--amber)}
#master.noans{background:var(--amber);border-color:var(--amber-ink);color:var(--amber-ink)}

#cfg{position:fixed;inset:0;z-index:20;background:rgba(7,6,5,.86);display:flex;align-items:flex-end;justify-content:center;
  padding:env(safe-area-inset-top,0px) var(--gr) calc(env(safe-area-inset-bottom,0px) + 12px) var(--gl)}
#cfg[hidden]{display:none}
#cfg .box{width:100%;max-width:480px;max-height:100%;overflow-y:auto;overflow-x:hidden;background:var(--panel);border:1px solid var(--gold);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:12px;touch-action:pan-y}
#cfg .opt{display:flex;flex-direction:column;gap:8px}
#cfg .opt .btn{display:flex;align-items:center;gap:12px;text-align:left;padding:0 14px}
#cfg .opt .btn i{flex:none;width:22px;height:22px;border-radius:5px;border:2px solid var(--gold)}
#cfg .opt .btn.sel{border-color:var(--gold)}
#cfg .opt .btn.sel i{background:var(--gold);box-shadow:inset 0 0 0 3px var(--panel)}
#cfg .opt .btn.sel:disabled{opacity:.7}
.who{display:flex;justify-content:space-between;align-items:center;gap:10px;font-weight:700;min-width:0}
.who span{min-width:0;overflow-wrap:anywhere}
.names{display:flex;flex-direction:column;gap:8px}
.names .btn.sel{border-color:var(--gold);background:linear-gradient(#F0CF7A,#C9953A);color:var(--bg)}
.field{width:100%;min-height:3.5rem;border-radius:var(--r);border:1px solid var(--line);background:var(--bg);color:var(--cream);padding:0 14px;font-size:1.125rem;user-select:text;-webkit-user-select:text}
.alrow{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line);min-width:0}
.alrow:first-of-type{border-top:0}
.alrow .tx{flex:1;min-width:0;font-weight:700;overflow-wrap:anywhere}
.alrow.fault .tx{color:var(--red-hi)} .alrow.warning .tx{color:var(--amber)}
.alrow .btn{flex:none;min-width:5rem}
.rep{display:flex;gap:10px;padding:8px 0;border-top:1px solid var(--line);min-width:0}
.rep b{flex:none;max-width:45%;overflow-wrap:anywhere;color:var(--champagne)}
.rep span{flex:1;min-width:0;overflow-wrap:anywhere;font-weight:700}
.rep.good span{color:var(--green)} .rep.bad span{color:var(--red-hi)} .rep.warn span{color:var(--amber)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <header id="top">
    <img src="/brand/logo_small.png" alt="Jeff Holmes Presents">
    <div class="st"><span class="cap" id="t-word"></span><span class="clk" id="t-clk">--:--:--</span></div>
    <span class="pill" id="t-arm">UNKNOWN</span>
    <button id="gear" data-act="gear" aria-label="Settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/></svg></button>
  </header>
  <div id="link" class="lost"><span id="link-t"></span><button id="alerts" data-act="alerts" hidden></button></div>
  <div id="mainw">
    <main id="main"></main>
    <div id="sheet" hidden></div>
  </div>
  <nav id="tabs"></nav>
  <div id="masterw"><button id="master" data-act="master">DISARM ALL</button></div>
</div>
<div id="cfg" hidden></div>
<!-- purge: its own safety PR -->
<div id="purge-mount" hidden></div>

<script>
"use strict";
/* ---------- plumbing ---------- */
const WINDOW_ID = "w-" + Math.random().toString(36).slice(2, 8);
const PAGE_ID = "pg-" + Math.random().toString(36).slice(2, 10);
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const mono = () => performance.now();
const sleep = ms => new Promise(r => setTimeout(r, ms));
const p2 = x => String(x).padStart(2, "0");
const mmss = t => { t = Math.max(0, Math.round(t)); const h = Math.floor(t / 3600), m = Math.floor(t % 3600 / 60), s = t % 60; return (h ? p2(h) + ":" : "") + p2(m) + ":" + p2(s); };
const hms = t => { t = Math.max(0, Math.round(t)); return p2(Math.floor(t / 3600)) + ":" + p2(Math.floor(t % 3600 / 60)) + ":" + p2(t % 60); };
function clock12(hm){ const m = /^(\d{1,2}):(\d{2})/.exec(String(hm || "")); if(!m) return String(hm || ""); let h = +m[1]; const ap = h >= 12 ? "PM" : "AM"; h = h % 12 || 12; return h + ":" + m[2] + " " + ap; }
function short(t, n){ t = String(t || "").replace(/\s+/g, " ").trim(); return t.length > n ? t.slice(0, n - 1).trimEnd() + "\u2026" : t; }

async function getJSON(p, ms){
  const ctl = new AbortController();
  const t = setTimeout(() => ctl.abort(), ms || 1500);
  try{
    const r = await fetch(p, {cache:"no-store", credentials:"same-origin", signal:ctl.signal});
    const j = await r.json().catch(() => ({}));

/* ---------- flame purge: tap, then confirm (confirmpurge.py) ---------- */
const PGK = {};          // button key -> {ids, label}, rebuilt on each draw
const PG_LIVE = ["arming", "holding", "firing"];
function purgeRun(){ const p = ((ST || {}).arming || {}).purge; return p && p.run ? p.run : null; }
function purgeLive(){ const r = purgeRun(); return !!(r && PG_LIVE.includes(r.state)); }
function purgeSecs(){
  const ts = (MO && MO.timed_settings) || {}, max = +ts.max_s || 30;
  return Math.max(1, Math.min(UI.psec || +ts.default_s || 5, max));
}
function purgeable(name){
  const ln = lockedNames();
  return (machinesOf(name) || []).filter(m => !m.never_purged && !ln.has(m.name));
}
function sameIds(a, b){ return a.length === b.length && a.every(x => b.includes(x)); }
function pgBtn(ids, k){
  const r = purgeRun(), pl = pendLabel("pg:" + k), at = `data-act="pg" data-k="${esc(k)}"`;
  if(purgeLive()){
    if(!sameIds(r.machines || [], ids)) return B(at, "btn", "PURGE", true);
    const left = Math.ceil(+((((ST || {}).morning || {}).timed || {}).left_s) || 0);
    const t = RETRY["pg-stop"] ? "SENDING" : r.state === "firing" && left ? "STOP " + left : "STOP";
    return B(`data-act="pg-stop"`, "btn amber", t, false);
  }
  if(pl) return B(at, "btn" + (pl === "NO ANSWER" ? " amber" : ""), pl, pl === "PENDING");
  if(!flamesKnown()) return B(at, "btn", "UNKNOWN", true);
  return B(at, "btn", "PURGE", lost() || !may("arm") || !ids.length);
}
function vPurge(){
  let h = `<h2>FLAME PURGE</h2>`;
  for(const k in PGK) delete PGK[k];
  if(!MO) return h + `<div class="none">UNKNOWN</div>`;
  const ts = MO.timed_settings || {}, max = +ts.max_s || 30, cur = purgeSecs();
  const ps = (Array.isArray(ts.presets) ? ts.presets : [2, 5, 10, 20, 30]).filter(x => x <= max);
  h += seg("", ps.map(x => `<button data-act="psec" data-n="${x}" class="${x === cur ? "sel" : ""}" ${purgeLive() ? "disabled" : ""}>${x} S</button>`).join(""));
  let any = false;
  fgroups().forEach(g => {
    const ms = purgeable(g.name); if(!ms.length) return;
    any = true;
    const ok = "p:" + g.name, o = !!UI.open[ok], one = ms.length < 2, gk = "g:" + g.name;
    PGK[gk] = {ids:ms.map(m => m.id), label:g.name};
    h += `<section class="card ${o ? "open" : ""}"><div class="row">` +
      (one ? `<span class="nm">${esc(g.name)}</span>` :
        `<button class="hd in" data-act="open" data-n="${esc(ok)}" aria-expanded="${o}"><span class="nm">${esc(g.name)}</span>${chev}</button>`) +
      pgBtn(PGK[gk].ids, gk) + `</div>` +
      (o && !one ? `<div class="units">` + ms.map(m => {
        const mk2 = "m:" + m.id; PGK[mk2] = {ids:[m.id], label:m.name};
        return `<div class="row"><span class="nm">${esc(m.name)}</span>${pgBtn([m.id], mk2)}</div>`;
      }).join("") + `</div>` : "") + `</section>`;
  });
  if(!any) h += `<div class="none">NONE</div>`;
  return h;
}
async function doPurge(k){
  const t = PGK[k], key = "pg:" + k; if(!t || PEND[key] || purgeLive()) return;
  const ids = t.ids.slice(), label = t.label, secs = purgeSecs(), sent = mono();
  PEND[key] = {state:"pending", at:mono()}; render();
  const r = await post("purge-request", {machines:ids, seconds:secs, seen:seenNow()});
  delete PEND[key];
  if(r.net){ line("NO ANSWER", "bad"); return; }
  if(!r.ok){ line(words(r), "bad"); return; }
  const min = (+r.j.min_s || 0.3) * 1000, life = (+r.j.expires_s || 5) * 1000;
  ask("PURGE " + label.toUpperCase() + " " + secs + " S", "amber", min, life - (mono() - sent), async () => {
    PEND[key] = {state:"pending", at:mono()}; render();
    const c = await post("purge-confirm", {ticket:r.j.ticket, seen:seenNow()});
    delete PEND[key];
    if(c.net){ PEND[key] = {state:"noans", at:mono()}; render(); return; }
    if(!c.ok){ line(words(c), "bad"); return; }
    UI.pgRun = c.j.run; render();
  }, () => {});
}
// Stop purge: safe to repeat, never disabled, tried until the engine answers.
function purgeStop(){
  sendSafe("pg-stop", "purge-stop", () => ({seen:seenNow()}), r => { if(!r.ok) line(words(r), "bad"); });
}
// The run this page started has ended: say how, once, unless it simply ran.
function purgeWatch(){
  const r = purgeRun();
  if(!r || UI.pgRun == null || r.run !== UI.pgRun || PG_LIVE.includes(r.state)) return;
  UI.pgRun = null;
  if(r.state !== "done" && r.text) line(r.text, r.state === "stopped" ? "warn" : "bad");
}

/* flame arm: tap, then confirm */
async function armRequest(name){
  const sent = mono();
  const r = await post("arm-request", {group:name, seen:seenNow()});
  if(r.net) return {err:"NO ANSWER"};
  if(!r.ok) return {err:words(r)};
  return {sent, ticket:r.j.ticket, min:(+r.j.min_s || 0.3) * 1000, life:(+r.j.expires_s || 5) * 1000};
}
function runFor(name, id){
  const rs = (((ST || {}).arming || {}).confirm || {}).runs || [];
  return rs.find(x => x.run === id) || rs.find(x => x.name === name && x.mine);
}
// after Confirm: follow the engine's run, then the group's own armed value
function followArm(name, runId){
  const key = "arm:flame:" + name; let tone = "bad";
  track(key, st => {
    const g = ((st.flames || {}).groups || []).find(x => x.name === name);
    const run = runFor(name, runId);
    if(run && run.state !== "holding" && run.state !== "armed"){
      tone = run.state === "elsewhere" ? "warn" : "bad";
      return {fail:true, text:run.text || run.state.toUpperCase()};
    }
    return !!(g && g.armed === "armed" && flamesKnown());
  }, 9000, t => line(t, tone));
}
async function armGroup(name){
  const key = "arm:flame:" + name;
  if(PEND[key] && PEND[key].state === "pending") return;
  PEND[key] = {state:"pending", at:mono()}; render();
  const q = await armRequest(name);
  delete PEND[key];
  if(q.err){ line(q.err, "bad"); return; }
  ask("ARM " + name.toUpperCase(), "green", q.min, q.life - (mono() - q.sent), async () => {
    PEND[key] = {state:"pending", at:mono()}; render();
    const r = await post("arm-confirm", {group:name, ticket:q.ticket, seen:seenNow()});
    delete PEND[key];
    if(r.net){ PEND[key] = {state:"noans", at:mono()}; render(); return; }
    if(!r.ok){ line(words(r), "bad"); return; }
    followArm(name, r.j.run);
  });
  BAR.key = key; render();
}
let SEQRUN = null;
async function armAllFlames(){
  const gs = fgroups().map(gview).filter(g => g.st === "safe" && !g.full);
  if(!gs.length || SEQRUN) return;
  ask("ARM ALL FLAMES", "green", 300, 8000, async () => {
    const run = SEQRUN = {cancel:false, done:0, total:gs.length};
    PEND["arm:flame:*"] = {state:"pending", at:mono()};
    const rep = [];
    for(const g of gs){
      if(run.cancel || lost()) { rep.push({name:g.name, state:"refused", text:"NOT TRIED"}); continue; }
      BAR = {kind:"line", tone:"warn", text:"ARMING " + (rep.length + 1) + " OF " + gs.length, onTap:null}; render();
      const q = await armRequest(g.name);
      if(q.err){ rep.push({name:g.name, state:"refused", text:q.err}); continue; }
      await sleep(q.min + 30);
      if(run.cancel){ rep.push({name:g.name, state:"refused", text:"CANCELLED"}); continue; }
      const key = "arm:flame:" + g.name;
      PEND[key] = {state:"pending", at:mono()}; render();
      const r = await post("arm-confirm", {group:g.name, ticket:q.ticket, seen:seenNow()});
      delete PEND[key];
      if(r.net){ rep.push({name:g.name, state:"timeout", text:"NO ANSWER"}); continue; }
      if(!r.ok){ rep.push({name:g.name, state:"refused", text:words(r)}); continue; }
      const out = await waitFor(st => {
        const run2 = runFor(g.name, r.j.run);
        if(run2 && run2.state !== "holding"){
          if(run2.state === "armed"){ const gg = (st.flames.groups || []).find(x => x.name === g.name); return gg && gg.armed === "armed" ? true : false; }
          return {fail:true, text:run2.text || run2.state};
        }
        return false;
      }, 8000);
      if(out.how === "ok") rep.push({name:g.name, state:"armed", text:""});
      else if(out.how === "fail"){ const run2 = runFor(g.name, r.j.run); rep.push({name:g.name, state:run2 ? run2.state : "refused", text:out.text}); }
      else rep.push({name:g.name, state:"timeout", text:"NO ANSWER"});
    }
    delete PEND["arm:flame:*"]; SEQRUN = null;
    REPORT = rep;
    const ok = rep.filter(r => r.state === "armed").length;
    line("ARMED " + ok + " OF " + rep.length, ok === rep.length ? "ok" : "bad", () => { SHEET = "report"; render(); });
  }, () => {});
  BAR.key = "arm:flame:*";
}

function lockGroup(names, all){

      if(err){ delete PEND[key]; line(err, "bad"); maybeMorning(true); return; }
      const nm = new Set(ms.map(m => m.name));
      track(key, st => !((st.morning || {}).locked_machines || []).some(x => nm.has(x))); maybeMorning(true);
    }, () => {}); BAR.key = key; return;

function doLevel(who, f, d){

  let base = vals.every(v => v === vals[0]) ? vals[0] : Math.round(vals.reduce((a, b) => a + b, 0) / vals.length / 5) * 5;
  const to = Math.max(0, Math.min(100, Math.round((base + d) / 5) * 5));
  const key = `lv:${who}:${f}`;
  PEND[key] = {state:"pending", at:mono()}; render();
  const body = {hazer:who === "*" ? "all" : who}; body[f] = to;

    if(!r.ok){ delete PEND[key]; line(words(r), "bad"); return; }
    track(key, st => ((st.hazers || {}).hazers || []).filter(h => who === "*" || h.name === who).every(h => (f === "haze" ? h.haze_pct : h.fan_pct) === to));
  });

/* master */
async function doMaster(){
  // One press, one request: the engine does every step itself, so a bad
  // link can never land one disarm and lose another. Tried until answered.
  cancelSeq();
  const key = "master", mm = masterMode();
  if(RETRY[key]) return;
  RETRY[key] = true; PEND[key] = {state:"sending", at:mono()}; render();
  let r;
  for(;;){ r = await post("master-disarm", {seen:seenNow()}, 4500); if(!r.net) break; await sleep(1000); }
  delete RETRY[key];
  if(!r.ok) line(words(r), "bad");
  track(key, st => {
    const gs = (st.flames || {}).groups || [];
    const fo = (st.flames && st.flames.connected && !st.flames.stale) ? gs.every(g => g.armed === "disarmed") : false;
    const ho = (((st.hazers || {}).hazers) || []).every(h => !h.armed);
    const lo = (((st.laser_arm || {}).lasers) || []).every(l => !l.armed);
    return fo && (!mm.hazers || ho) && (!mm.lasers || lo);
  }, 3000);
  const w = WAITS.find(x => x.key === key);
  if(w){ const old = w.test; w.test = st => { const q = old(st); if(q === true) UI.flash = mono() + 1500; return q; }; }
}

  const u = UI.sign, pw = $("pw");
  if(!u.name){ u.msg = "PICK A NAME"; renderSheet(); return; }
  u.busy = true; u.msg = ""; renderSheet();
  const r = await post("signin", {name:u.name, password:pw ? pw.value : ""});
  u.busy = false;
  if(r.net){ u.msg = "NO ANSWER"; renderSheet(); return; }
  if(!r.ok){ if(r.j && r.j.needs_new_password) u.need = true; u.msg = words(r); renderSheet(); return; }
  u.msg = ""; u.need = false; SHEET = null;
  try{ const s = await getJSON("/api/remote/status", 1500); ST = s; LAST_OK = mono(); SEQ++; }catch(e){}
  render();
}
async function doSignout(){
  const r = await post("signout", {});
  SHEET = null;
  if(!r.net && !r.ok) line(words(r), "bad");
  UI.signAuto = false; render();
}

/* ---------- arm runs seen in the status: an alert in the bar when another screen's run matters ---------- */
function runWatch(){ /* runs this page started are followed by followArm / armAllFlames */ }

/* ---------- clock tick ---------- */
setInterval(() => {
  expirePends(); evalWaits();
  if(BAR && BAR.kind === "confirm" && mono() > BAR.endAt){ const f = BAR.onCancel; BAR = null; if(f) f(); }
  renderAll();
}, 250);
document.addEventListener("visibilitychange", () => {
  if(document.visibilityState === "visible"){
    EPOCH++; LAST_OK = null; LOST_SINCE = mono(); wake(); renderAll();
  }
});
let WL = null;
async function wake(){ try{ if(navigator.wakeLock && document.visibilityState === "visible") WL = await navigator.wakeLock.request("screen"); }catch(e){} }
wake();
renderAll();
startPolling();
</script>
