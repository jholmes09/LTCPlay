name: sweep dropped

# A scheduled nightly or weekly sweep that never got to report. The two
# share one concurrency group (mutate-sweeps) that queues rather than
# cancels, but GitHub keeps only the newest waiting run: a third start
# drops the waiting one, cancelled before any of its jobs ran, so its own
# report job never ran either. A sweep stopped by hand, or one that could
# not start at all, is the same. This opens (or adds to) the sweep's issue,
# so a dropped night is as loud as a red one.
#
# workflow_run starts only from the default branch's copy (main).
on:
  workflow_run:
    workflows: ["nightly mutate", "weekly mutate"]
    types: [completed]

permissions:
  contents: read

jobs:
  dropped:
    if: github.event.workflow_run.event == 'schedule' && (github.event.workflow_run.conclusion == 'cancelled' || github.event.workflow_run.conclusion == 'startup_failure' || github.event.workflow_run.conclusion == 'timed_out')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      issues: write
    steps:
      - shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          NAME: ${{ github.event.workflow_run.name }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          set -uo pipefail
          # Its own report ran (and said red) when a report job finished.
          reported=$(gh api "repos/$REPO/actions/runs/$RUN_ID/jobs?per_page=100" \
                       --jq '[.jobs[] | select(.name == "report" and (.conclusion == "success" or .conclusion == "failure"))] | length' 2>/dev/null || echo 0)
          if [[ "$reported" != 0 ]]; then
            echo "the $NAME run reported for itself"
            exit 0
          fi
          if [[ "$NAME" == "nightly mutate" ]]; then label=mutate-nightly; what="nightly mutation sweep"; else label=mutate-sweep; what="weekly mutation sweep"; fi
          body="The scheduled $what [run $RUN_ID]($RUN_URL) ended $CONCLUSION before it could report: nothing it was to prove has been proved. Start it again from the Actions tab (Run workflow, on bench-build), or let the next scheduled run cover it."
          gh label create "$label" --repo "$REPO" --color B60205 --description "the $what is red" --force > /dev/null 2>&1 || true
          open_issue=$(gh issue list --repo "$REPO" --label "$label" --state open --json number --jq '.[0].number // empty' 2>/dev/null || true)
          if [[ -n "$open_issue" ]]; then
            gh issue comment "$open_issue" --repo "$REPO" --body "$body" || true
          else
            gh issue create --repo "$REPO" --title "The $what is red" --label "$label" --body "$body" || true
          fi
          echo "::error::the scheduled $what run $RUN_ID ended $CONCLUSION without reporting"
          exit 1
