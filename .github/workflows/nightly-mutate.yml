name: nightly mutate

# What bench-build changed since the last green night, every evening but
# Saturday's (Saturday evening is the weekly sweep of everything,
# weekly-mutate.yml).
#
# PRs into bench-build run no release shards (the CI diet, 2026-11-13: the
# shards were nine tenths of the account's runner time and queued the
# required checks for hours); a PR that touches a safety file runs that
# file's own mutations (mutate-safety, selftest.yml). This is where the rest
# runs: `mutate.py --changed BASE` on bench-build's head, where BASE is the
# commit the last green night proved. A red night is therefore run again,
# with whatever merged since, every night until it is fixed. With no green
# night on record (the first night, or none in the last 30 runs), BASE is
# where bench-build last met main: everything since the last release.
#
# The cap. A night that selects more than MUTATE_NIGHTLY_MAX mutations
# (a repository variable, default 1500: about 4,200 runner minutes, 4.5
# hours on 16 slots) runs only the whole safety core and the touched safety
# files' own mutations (mutate.py --targets), and leaves the rest to the
# weekly sweep, which runs everything; the summary and the issue say so.
# Uncapped, a heavy night (4,182 mutations on 2026-11-07) would be about
# 11,700 runner minutes and 12 hours on 16 slots, into the next working day.
#
# Each night: one selftest on ubuntu, then the shards, ubuntu only, each
# trusting that selftest instead of running the whole suite again
# (mutate.py --trust-baseline). How many shards and how many at once is
# .github/scripts/mutate_plan.py. Only the scheduled night (or a Run
# workflow on bench-build with no base of its own) is the record: it alone
# opens or closes the `mutate-nightly` issue, and a green one alone writes
# the "green at <commit>" job the next night reads. A run on another branch
# or with a narrower base reports in its own summary only. The report
# always runs: a plan that failed (a repository variable that is not a
# number, mutate.py crashing) is a red night like any other.
#
# GitHub starts scheduled workflows only from the default branch (main), so
# the schedule below runs main's copy of this file, against bench-build.
on:
  schedule:
    # 02:17 UTC Monday to Saturday: 19:17 Mountain Standard Time (20:17 in
    # summer) the evening before, Sunday to Friday. Done before the next
    # working day: the cap keeps a night under about 5 hours.
    - cron: "17 2 * * 1-6"
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch or commit to sweep"
        type: string
        default: bench-build
      base:
        description: "Compare against this commit (empty: the last green night)"
        type: string
        default: ""

permissions:
  contents: read

# One sweep at a time, nightly and weekly together, so two sweeps never
# hold twice the shard slots. A start while one runs waits for it (GitHub
# keeps the newest waiting run only; a scheduled one dropped that way is
# reported by sweep-dropped.yml).
concurrency:
  group: mutate-sweeps
  cancel-in-progress: false

env:
  # The record night: scheduled, or by hand on bench-build with no base.
  OFFICIAL: ${{ github.event_name == 'schedule' || (inputs.ref == 'bench-build' && inputs.base == '') }}

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    outputs:
      mode: ${{ steps.pick.outputs.mode }}
      base: ${{ steps.pick.outputs.base }}
      sha: ${{ steps.pick.outputs.sha }}
      targets: ${{ steps.pick.outputs.targets }}
      capped: ${{ steps.pick.outputs.capped }}
      selected: ${{ steps.pick.outputs.selected }}
      shards: ${{ steps.pick.outputs.shards }}
      nshards: ${{ steps.pick.outputs.nshards }}
      parallel: ${{ steps.pick.outputs.parallel }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || 'bench-build' }}
          fetch-depth: 0
      - id: pick
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          WANT_BASE: ${{ inputs.base }}
          CI_JOB_SLOTS: ${{ vars.CI_JOB_SLOTS }}
          CI_SLOT_RESERVE: ${{ vars.CI_SLOT_RESERVE }}
          MUTATE_SHARDS: ${{ vars.MUTATE_SHARDS }}
          MUTATE_NIGHTLY_MAX: ${{ vars.MUTATE_NIGHTLY_MAX }}
        run: |
          set -euo pipefail
          sha=$(git rev-parse HEAD)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          base="$WANT_BASE"
          why="the base asked for by hand"
          if [[ -z "$base" ]]; then
            # The newest "green at <commit>" job of an earlier night whose
            # commit this one descends from. A failed lookup is not fatal:
            # it falls back to the wider base below, never a narrower one.
            ids=$(gh api "repos/$REPO/actions/workflows/nightly-mutate.yml/runs?status=completed&per_page=30" \
                    --jq '.workflow_runs[].id' 2>/dev/null) || ids=""
            for id in $ids; do
              g=$(gh api "repos/$REPO/actions/runs/$id/jobs?per_page=100" \
                    --jq '.jobs[] | select(.conclusion == "success") | .name' 2>/dev/null \
                  | sed -n 's/^green at \([0-9a-f]\{40\}\)$/\1/p' | head -n 1) || g=""
              if [[ -n "$g" ]] && git merge-base --is-ancestor "$g" "$sha" 2>/dev/null; then
                base="$g"
                why="the last green night (run $id)"
                break
              fi
            done
          fi
          if [[ -z "$base" ]]; then
            base=$(git merge-base "$sha" origin/main 2>/dev/null) || base=""
            why="no green night on record: everything since bench-build last met main"
          fi
          targets=""
          capped=false
          if [[ -z "$base" ]] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "no base to compare against: every mutation"
            mode=full
            base=""
            n=$(python3 mutate.py --list | grep -c '^  would run' || true)
          else
            echo "base ${base:0:10}: $why"
            out="$RUNNER_TEMP/selection.txt"
            if ! python3 mutate.py --changed "$base" --list > "$out"; then
              cat "$out"
              echo "::error::mutate.py could not work out what changed since ${base:0:10}"
              exit 1
            fi
            grep -v '^  would run' "$out" || true
            n=$(grep -c '^  would run' "$out" || true)
            mode=affected
            if grep -q 'nothing to run' "$out" || (( n == 0 )); then mode=none; n=0; fi
          fi
          echo "selected=$n" >> "$GITHUB_OUTPUT"
          python3 .github/scripts/mutate_plan.py nightly-cap "$n" | tee "$RUNNER_TEMP/cap.txt"
          if grep -q '^capped=true' "$RUNNER_TEMP/cap.txt"; then
            if grep -q -- '"--targets"' mutate.py; then
              if [[ -n "$base" ]]; then
                git diff --name-only "$(git merge-base "$base" "$sha")" "$sha" > "$RUNNER_TEMP/changed.txt"
              else
                : > "$RUNNER_TEMP/changed.txt"
              fi
              python3 .github/scripts/mutate_plan.py safety-targets --with-core < "$RUNNER_TEMP/changed.txt" | tee "$RUNNER_TEMP/targets.txt"
              targets=$(sed -n 's/^safety_targets=//p' "$RUNNER_TEMP/targets.txt")
              n=$(python3 mutate.py --targets "$targets" --list | grep -c '^  would run' || true)
              mode=targets
              capped=true
              echo "::warning title=nightly capped::$(sed -n 's/^selected=//p' "$GITHUB_OUTPUT") mutations selected, over the cap of $(sed -n 's/^cap=//p' "$RUNNER_TEMP/cap.txt"): running the safety core and the touched safety files ($n); the rest is left to the weekly sweep"
            else
              echo "::warning::over the cap, but this mutate.py has no --targets: running the whole selection"
            fi
          fi
          echo "$n mutations to run ($mode)"
          python3 .github/scripts/mutate_plan.py size "$n" | tee -a "$GITHUB_OUTPUT"
          { echo "mode=$mode"; echo "base=$base"; echo "targets=$targets"; echo "capped=$capped"; } >> "$GITHUB_OUTPUT"

  # The whole suite once, on the commit the shards sweep. The shards need it
  # green, and then trust it instead of each running it again.
  selftest:
    needs: plan
    if: needs.plan.outputs.mode != 'none'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/workflows/nightly-mutate.yml
      - run: python -m pip install numpy zstandard tzdata pillow
      - shell: bash
        run: python -u selftest.py 2>&1 | tee "$RUNNER_TEMP/selftest.log"
      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: selftest-log-ubuntu-latest
          path: ${{ runner.temp }}/selftest.log
          retention-days: 7
          if-no-files-found: ignore

  sweep:
    needs: [plan, selftest]
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(needs.plan.outputs.parallel) }}
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    runs-on: ubuntu-latest
    # The same limits as selftest.yml's mutate job (the reason is there).
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.plan.outputs.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/workflows/nightly-mutate.yml
      - run: python -m pip install numpy zstandard tzdata pillow
      - id: sweep
        shell: bash
        timeout-minutes: 340
        env:
          MODE: ${{ needs.plan.outputs.mode }}
          BASE: ${{ needs.plan.outputs.base }}
          TARGETS: ${{ needs.plan.outputs.targets }}
          N: ${{ needs.plan.outputs.nshards }}
        run: |
          narrow=()
          if [[ "$MODE" == affected ]]; then narrow=(--changed "$BASE"); fi
          if [[ "$MODE" == targets ]]; then narrow=(--targets "$TARGETS"); fi
          trust=()
          if grep -q -- '"--trust-baseline"' mutate.py; then trust=(--trust-baseline 1200); fi
          python -u mutate.py --shard "${{ matrix.shard }}/$N" --expected mutate_expected_misses.txt --hints mutate_catchers.json --jobs 3 "${narrow[@]}" "${trust[@]}" 2>&1 | tee "$RUNNER_TEMP/mutate.log"
      - name: Report a shard that ran out of time
        if: always() && steps.sweep.outcome != 'success' && steps.sweep.outcome != 'skipped'
        shell: bash
        env:
          SHARD: ${{ matrix.shard }}
          N: ${{ needs.plan.outputs.nshards }}
          LOG: ${{ runner.temp }}/mutate.log
        run: python3 .github/scripts/shard_timeout.py
      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: mutate-log-ubuntu-latest-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/mutate.log
          retention-days: 7
          if-no-files-found: ignore

  # Which jobs are red, in the run's summary and (the record night only) in
  # an issue labelled mutate-nightly; a green record night closes it. Always
  # runs: a failed plan is red too.
  report:
    needs: [plan, selftest, sweep]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      issues: write
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.plan.outputs.sha || github.sha }}
      - shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          WHAT: nightly mutation sweep
          LABEL: mutate-nightly
          SWEPT: ${{ inputs.ref || 'bench-build' }} at ${{ needs.plan.outputs.sha || 'an unknown commit' }}
          PLAN: ${{ needs.plan.result }}
          MODE: ${{ needs.plan.outputs.mode }}
          SELFTEST: ${{ needs.selftest.result }}
          NSHARDS: ${{ needs.plan.outputs.nshards }}
          CAPPED: ${{ needs.plan.outputs.capped }}
          SELECTED: ${{ needs.plan.outputs.selected }}
          JOB_PREFIX: "sweep ("
        run: bash .github/scripts/sweep_report.sh

  # The record the next night reads: this commit is proved. Only on the
  # record night (scheduled, or by hand on bench-build with no base), and
  # only when it had nothing to run or its selftest and every shard were
  # green. A capped night counts: its rest is the weekly sweep's.
  green:
    name: green at ${{ needs.plan.outputs.sha }}
    needs: [plan, selftest, sweep]
    if: always() && (github.event_name == 'schedule' || (inputs.ref == 'bench-build' && inputs.base == '')) && needs.plan.result == 'success' && (needs.plan.outputs.mode == 'none' || (needs.selftest.result == 'success' && needs.sweep.result == 'success'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - shell: bash
        env:
          BASE: ${{ needs.plan.outputs.base }}
          SHA: ${{ needs.plan.outputs.sha }}
          CAPPED: ${{ needs.plan.outputs.capped }}
        run: |
          echo "every mutation selected since ${BASE:-the start} is caught at $SHA"
          if [[ "$CAPPED" == true ]]; then echo "(capped: the safety core and the touched safety files only; the rest is the weekly sweep's)"; fi
