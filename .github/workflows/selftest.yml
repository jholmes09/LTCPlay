name: selftest

# The per-PR gate. What runs when, how long it takes and what a failure means
# is written up in TESTING.md; the short version:
#
#   selftest   every PR, every push to main, every tag: the whole suite on
#              ubuntu and windows, about 15 to 20 minutes on ubuntu and
#              25 to 35 on windows (2026-11-03), limits 45 and 60
#   changes    works out which mutations the diff can have changed the
#              result of (mutate.py --changed: the mutations of the files
#              the diff touches, every flamesafe, conductor and flame link
#              mutation when a safety file is touched, new or edited
#              mutations, and whatever a deleted test guarded) and how many
#              shards that needs: none for a doc, a launcher, the packaging
#              or this workflow; about 25 mutations a shard otherwise, 96 at
#              most; 96 for a release tag or a change with no base.
#              A PR into main (a release) is judged by release_gate.py
#              instead, in three tiers: docs (Markdown only: no shard),
#              scoped (the mutations near the changed lines plus a fixed
#              safety core, sized to finish in one wave of 16 shards) and
#              full (every mutation: the gate's own files, the suite's
#              shared code, an open mutate-sweep issue, or any error).
#              A push to main runs every mutation after the merge, and a
#              red one opens the mutate-sweep issue.
#   mutate     those shards, ubuntu (a release tag: ubuntu and windows). No
#              shard job is started at all when there is nothing to run.
#              They start only once both selftest jobs are green (a red
#              suite makes every mutation look caught, so the shards would
#              measure nothing), and at most 16 run at once, so a PR never
#              takes more than 16 of the account's 20 job slots. On a PR into
#              bench-build they are not required to merge: the required
#              checks are selftest (ubuntu-latest), selftest
#              (windows-latest), changes and installer (windows-app.yml).
#              The whole list also runs every Sunday and on demand
#              (weekly-mutate.yml).
#   ci         the ONE required check on main: green when selftest, changes
#              and every mutate shard are green, or when mutate had nothing
#              to run. Branch protection names this job, not the shards, so
#              the shard count can follow the work.
#
# A PR runs once, as a pull_request. Pushes run only for main and for release
# tags, so a PR branch is not tested twice. Changing a PR's base starts no
# run, so ci refuses to certify any base but main (see the ci job): a PR
# moved to main is closed and reopened, or pushed, to run the gate. ready_for_review is listed with
# the three GitHub gives by default because that is the moment a draft's
# mutate job, skipped while it stays a draft, is first allowed to run.
on:
  push:
    branches: [main]
    tags: ["**"]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

# A newer push to the same PR makes the older run pointless, so it is
# cancelled, shards and all (the group is the workflow and the PR's ref,
# refs/pull/N/merge, so it never touches another PR). Every push to main and
# every tag gets a group of its own: they are never cancelled, and never
# queue behind mutate.py either.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The Windows show PC is the version that must work; ubuntu is the cheap
  # second opinion. macOS is no longer tested here: the Dollywood Mac is
  # frozen at gpl-2026.09.15.10 and main no longer keeps GPL behavior.
  selftest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # Measured 2026-11-03: ubuntu 16 to 20 minutes, windows 27 to 35 (one
    # good run was cancelled at its old 35 minute limit). The limits leave
    # room for a slow runner; a hung test still ends the job.
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 60 || 45 }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/workflows/selftest.yml
      # pillow: the Stream Deck's key drawing (ltcplay/streamdeck.py), so
      # its pixel test runs here too. The suite also passes without it.
      - run: python -m pip install numpy zstandard tzdata pillow
      # selftest.py writes each failure as an annotation and its totals to
      # the job summary. The whole log is kept as an artifact for a week,
      # since the job log cannot always be fetched (a cloud session's proxy
      # blocks the log store). pipefail (bash's default in Actions) keeps
      # selftest.py's exit code through tee.
      - shell: bash
        run: python -u selftest.py 2>&1 | tee "$RUNNER_TEMP/selftest.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selftest-log-${{ matrix.os }}
          path: ${{ runner.temp }}/selftest.log
          retention-days: 7
          if-no-files-found: ignore

  # Decides what the mutate shards do:
  #   mode=full      a release tag: every mutation, ubuntu and windows
  #   mode=affected  a PR or a push to main with a base to diff against:
  #                  each shard runs `mutate.py --changed BASE`, which picks
  #                  the mutations the diff can have changed the result of
  #                  (the rules are in mutate.py, select_affected(), and
  #                  TESTING.md), so the list of files to watch can never
  #                  drift from the list of files mutate.py breaks
  #                  The shard count follows the selection: about 25
  #                  mutations a shard (about 80 minutes on ubuntu with
  #                  --jobs 3), 96 at most
  #   mode=none      that selection is empty (a doc, a launcher, the brand,
  #                  this workflow): no shard job is started at all
  #   mode=release   a PR into main whose release gate tier is scoped:
  #                  each shard runs `mutate.py --only` the names
  #                  release_gate.py lists, which it works out again in
  #                  the shard and must match count and digest here
  # A PR into main is never judged by select_affected(): release_gate.py
  # decides its tier (docs: mode none; scoped: mode release; full: every
  # mutation). If release_gate.py fails or says anything else, the tier is
  # full: the gate fails closed, never open. A push to main is the release
  # that just merged: every mutation, after the fact (mutate-report opens
  # the mutate-sweep issue when it is red). A push with no usable base (a
  # first push, a rewritten one) runs everything rather than guess.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # To ask whether the last whole sweep is red (an open mutate-sweep
      # issue): then a release with any code in it runs everything.
      issues: read
    outputs:
      mode: ${{ steps.decide.outputs.mode }}
      base: ${{ steps.decide.outputs.base }}
      oses: ${{ steps.decide.outputs.oses }}
      shards: ${{ steps.decide.outputs.shards }}
      nshards: ${{ steps.decide.outputs.nshards }}
      tier: ${{ steps.decide.outputs.tier }}
      gate_files: ${{ steps.banner.outputs.gate_files }}
      count: ${{ steps.decide.outputs.count }}
      digest: ${{ steps.decide.outputs.digest }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # A PR that edits .github/ (the workflows that make ci) or a
      # .gitattributes is said loudly: such a PR can lower its own gate,
      # and only a person reading the diff stops it. ci repeats it.
      - id: banner
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          files=$(git -c core.attributesFile=/dev/null diff --name-only --no-renames "$(git merge-base "$PR_BASE" HEAD)" HEAD | grep -E '^\.github/|(^|/)\.gitattributes$' | tr '\n' ' ' || true)
          if [[ -n "$files" ]]; then
            echo "::error title=THIS PR EDITS THE CI ITSELF::$files: read this diff yourself before merging; a PR that edits the workflows can lower its own gate"
            echo "gate_files=$files" >> "$GITHUB_OUTPUT"
          fi
      - id: decide
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          BEFORE: ${{ github.event.before }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -u
          # The shard count of a whole sweep, and the most an affected run
          # gets. Sized so a shard of the whole list (4300 mutations / 96 =
          # 45) ends in 115 to 135 minutes, far inside its 340 (see the mutate
          # job). weekly-mutate.yml uses the same number.
          FULL_SHARDS=96
          shards_json() {    # 0..N-1 as a JSON list
            python3 -c "import json,sys; print(json.dumps(list(range(int(sys.argv[1])))))" "$1"
          }
          say() {
            echo "$1"
            { echo "mode=$2"; echo "base=$3"; echo "oses=$4"; echo "nshards=$5";
              echo "shards=$(shards_json "$5")"; } >> "$GITHUB_OUTPUT"
            exit 0
          }
          if [[ "$REF" == refs/tags/* ]]; then
            say "release tag: every mutation, ubuntu and windows, $FULL_SHARDS shards each" full "" '["ubuntu-latest","windows-latest"]' "$FULL_SHARDS"
          fi
          if [[ "$EVENT" == push && "$REF" == refs/heads/main ]]; then
            say "a push to main (a merged release): every mutation, ubuntu, $FULL_SHARDS shards, after the fact; a red sweep opens the mutate-sweep issue" full "" '["ubuntu-latest"]' "$FULL_SHARDS"
          fi
          if [[ "$EVENT" == pull_request ]]; then base="$PR_BASE"; else base="$BEFORE"; fi
          if [[ -z "$base" || "$base" =~ ^0+$ ]] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            say "no base to compare against: every mutation, ubuntu, $FULL_SHARDS shards" full "" '["ubuntu-latest"]' "$FULL_SHARDS"
          fi
          # The BASE branch's copy of the gate, never the PR's own: a PR
          # that edits release_gate.py or mutate.py is judged by the ones
          # it would replace. No copy there: no base gate (full below).
          bg="$RUNNER_TEMP/base-gate"; mkdir -p "$bg"; have_bg=1
          for f in release_gate.py mutate.py mutate_catchers.json; do
            git show "$base:$f" > "$bg/$f" 2>/dev/null || have_bg=0
          done
          # A mutation may leave mutate.py only with a reason in
          # mutate_removed.txt (any PR; the base's checker when it has one).
          checker="$bg/release_gate.py"; if (( ! have_bg )); then checker=release_gate.py; fi
          if [[ "$EVENT" == pull_request ]] && ! python3 "$checker" --repo . --base "$base" --check-removed; then
            exit 1
          fi
          # A release (a PR into main): the release gate's tier, worked out
          # from the diff by the base's release_gate.py, never from what
          # anyone says about the change. Anything but a clean "docs" or
          # "scoped" answer is the whole list (fails closed).
          if [[ "$EVENT" == pull_request && "$PR_BASE_REF" == main ]]; then
            red=()
            if ! open_issue=$(gh issue list --repo "$REPO" --label mutate-sweep --state open --json number --jq '.[0].number // empty'); then
              red=(--sweep-red "could not ask whether the last whole sweep is red")
            elif [[ -n "$open_issue" ]]; then
              red=(--sweep-red "the last whole sweep on main is red (issue #$open_issue): fix it in this release")
            fi
            gate="$RUNNER_TEMP/gate.out"; : > "$gate"
            tier=full; count=0; digest=""
            if (( ! have_bg )); then
              echo "::warning::main has no release_gate.py yet: this release runs every mutation"
            elif GITHUB_OUTPUT="$gate" python3 "$bg/release_gate.py" --repo . --base "$base" --github-output "${red[@]}"; then
              tier=$(sed -n 's/^tier=//p' "$gate"); count=$(sed -n 's/^count=//p' "$gate"); digest=$(sed -n 's/^digest=//p' "$gate")
            else
              echo "::warning::release_gate.py failed: this release runs every mutation"
            fi
            if [[ "$tier" == docs ]]; then
              echo "tier=docs" >> "$GITHUB_OUTPUT"
              say "release gate, tier docs: Markdown only, the selftest only, no shard" none "$base" '["ubuntu-latest"]' 1
            fi
            if [[ "$tier" == scoped && "$count" =~ ^[0-9]+$ && "$digest" =~ ^[0-9a-f]{16}$ ]] && (( count > 0 )); then
              # One wave: up to 16 shards (max-parallel) of about 10 or
              # more, so a shard is a 15 to 19 minute baseline plus about
              # 2.4 minutes a mutation (the core alone, about 900, is 16 of
              # about 57: 2.5 to 2.8 hours); past 960 mutations more
              # shards, never over 60 each (about 165 minutes, far inside
              # the 340 limit).
              k=$(( (count + 9) / 10 )); if (( k > 16 )); then k=16; fi
              m=$(( (count + 59) / 60 )); if (( m > k )); then k=$m; fi
              if (( k > FULL_SHARDS )); then k=$FULL_SHARDS; fi
              { echo "tier=scoped"; echo "count=$count"; echo "digest=$digest"; } >> "$GITHUB_OUTPUT"
              say "release gate, tier scoped: $count mutations, ubuntu, $k shard(s)" release "$base" '["ubuntu-latest"]' "$k"
            fi
            echo "tier=full" >> "$GITHUB_OUTPUT"
            say "release gate, tier full (it said: ${tier:-nothing}): every mutation, ubuntu, $FULL_SHARDS shards" full "" '["ubuntu-latest"]' "$FULL_SHARDS"
          fi
          # mutate.py --list needs no numpy: it stops before the baseline.
          # Exit 0 with "nothing to run" means the selection is empty.
          out="$RUNNER_TEMP/selection.txt"
          if ! python3 mutate.py --changed "$base" --list > "$out"; then
            cat "$out"
            echo "::error::mutate.py could not work out what this change affects"
            exit 1
          fi
          grep -v '^  would run' "$out" || true
          n=$(grep -c '^  would run' "$out" || true)
          echo "$n mutations would run"
          if grep -q 'nothing to run' "$out"; then
            say "nothing this change can have broken is mutated: no shard runs" none "$base" '["ubuntu-latest"]' 1
          fi
          # About 25 mutations a shard: on ubuntu with --jobs 3 a mutation
          # costs 2.2 to 2.5 minutes of a shard after a 15 to 19 minute
          # baseline (run 42577562836, 2026-11-09), so about 80 minutes.
          # Past 2400 mutations the cap holds and a shard gets more, never
          # over 45 (4300 / 96). The shards split the full list by index
          # (mutate.py --shard I/N keeps index % N == I), so 0..N-1 always
          # cover every selected one.
          k=$(( (n + 24) / 25 )); if (( k < 1 )); then k=1; fi; if (( k > FULL_SHARDS )); then k=$FULL_SHARDS; fi
          say "the $n affected mutations, ubuntu, $k shard(s)" affected "$base" '["ubuntu-latest"]' "$k"

  # The account runs at most 20 jobs at once, shared by every workflow and
  # every PR. So the shards (2026-10-29, the congestion of 10-26 to 10-28):
  #   - start only for a change that has something to mutate (no job at
  #     all for mode none, not 96 empty ones), as many as the selection
  #     needs (the changes job), never more than 96;
  #   - start only after both selftest jobs are green. On a PR into
  #     bench-build that is the fast lane: the required checks (selftest
  #     on ubuntu and windows, changes, installer) finish first and are
  #     never queued behind shards; the shards follow and are not
  #     required to merge;
  #   - run at most 16 at once (max-parallel), leaving the other 4 slots
  #     for other PRs' selftest and installer jobs. A whole sweep of 96
  #     shards is 6 waves of 16, about 11 to 14 hours on ubuntu;
  #   - are skipped while the PR is a draft and run for the first time
  #     when it is marked ready for review; selftest itself still runs on
  #     every push, drafts included.
  mutate:
    needs: [changes, selftest]
    if: needs.changes.outputs.mode != 'none' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix:
        os: ${{ fromJSON(needs.changes.outputs.oses) }}
        shard: ${{ fromJSON(needs.changes.outputs.shards) }}
    runs-on: ${{ matrix.os }}
    # Sized for a full sweep: 4300 mutations in 96 shards, 45 a shard.
    # Measured on ubuntu with fail fast, catcher hints and --jobs 3 (run
    # 42577562836, 2026-11-09, 10 shards at once): a baseline of 15 to 19
    # minutes, then 2.2 to 2.5 minutes a mutation, so 45 take about 115 to
    # 135 minutes. With 32 shards of 135 the same runners needed 307 to
    # 340, and 8 of the first 14 ran out at 340 with 128 to 132 done. The
    # limits stay as a backstop only: 355 is under GitHub's 360 cap, and
    # an affected run is a fraction of it. The sweep step stops itself 15
    # minutes before this limit so the job is never killed from outside
    # with nothing said.
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v5
        with:
          # --changed reads the base revision's mutate.py, selftest.py and
          # expected-miss list out of git.
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/workflows/selftest.yml
      # The same packages as the selftest job, pillow included: without it
      # the Stream Deck pixel tests skip themselves, and the three "Deck
      # latched" mutations in streamdeck.py were NOT CAUGHT in every sweep
      # here while they were caught on any box with Pillow (PR #43, #46 and
      # #49, shards 14 and 15). selftest.py now fails in CI when Pillow is
      # missing, so this line cannot drift from the one above again.
      - run: python -m pip install numpy zstandard tzdata pillow
      # The expected-miss list is the mutations only the real show folder
      # can catch. Any other miss, any listed one that is now caught, and any
      # SETUP FAIL fails the job. Each mutated run stops after its first
      # failing test, and runs the test that caught that mutation last time
      # first (--hints; mutate.py says when such a run counts). Ubuntu runs
      # three mutations at once (--jobs 3), each in its own copy of the tree
      # that first runs its own whole baseline; Windows runs one at a time.
      # The step has its own limit, 15 minutes
      # under the job's, so that when a shard runs out of time the step
      # after it still runs and can say so. pipefail (bash's default in
      # Actions) keeps mutate.py's exit code through tee.
      - id: sweep
        shell: bash
        timeout-minutes: 340
        env:
          MODE: ${{ needs.changes.outputs.mode }}
          BASE: ${{ needs.changes.outputs.base }}
          N: ${{ needs.changes.outputs.nshards }}
          COUNT: ${{ needs.changes.outputs.count }}
          DIGEST: ${{ needs.changes.outputs.digest }}
        run: |
          narrow=()
          if [[ "$MODE" == affected ]]; then narrow=(--changed "$BASE"); fi
          if [[ "$MODE" == release ]]; then
            # The release gate's list, worked out again here from the same
            # commit; it must be the very list the changes job sized.
            # The base branch's gate, as in the changes job.
            names="$RUNNER_TEMP/release_names.txt"; bg="$RUNNER_TEMP/base-gate"; mkdir -p "$bg"
            for f in release_gate.py mutate.py mutate_catchers.json; do git show "$BASE:$f" > "$bg/$f"; done
            python -u "$bg/release_gate.py" --repo . --base "$BASE" --names-out "$names" | tee "$RUNNER_TEMP/mutate.log"
            got=$(python -c "import hashlib,sys; print(hashlib.sha256('\n'.join(sorted(l.rstrip('\n') for l in open(sys.argv[1], encoding='utf-8'))).encode()).hexdigest()[:16])" "$names")
            have=$(grep -c . "$names" || true)
            if [[ "$got" != "$DIGEST" || "$have" != "$COUNT" ]]; then
              echo "::error title=release gate::this shard's list ($have, $got) is not the changes job's ($COUNT, $DIGEST): nothing was run" | tee -a "$RUNNER_TEMP/mutate.log"
              exit 1
            fi
            narrow=(--only "$names")
          fi
          python -u mutate.py --shard ${{ matrix.shard }}/$N --expected mutate_expected_misses.txt --hints mutate_catchers.json --jobs ${{ matrix.os == 'ubuntu-latest' && 3 || 1 }} "${narrow[@]}" 2>&1 | tee -a "$RUNNER_TEMP/mutate.log"
      # Tells a shard that ran out of time apart from a missed mutation. A
      # miss prints NOT CAUGHT or UNEXPECTED MISS and the sweep reaches its
      # "caught N, missed M" line. A shard that ran out of time never reaches
      # that line, so this names every mutation of the shard that has no
      # result in the log. The mutation being run when the clock stopped is
      # one of them: its result is unknown, not "caught".
      - name: Report a shard that ran out of time
        if: always() && steps.sweep.outcome != 'success' && steps.sweep.outcome != 'skipped'
        shell: bash
        env:
          SHARD: ${{ matrix.shard }}
          N: ${{ needs.changes.outputs.nshards }}
          LOG: ${{ runner.temp }}/mutate.log
        run: |
          python - <<'PY'
          import ast, os

          shard, total = int(os.environ["SHARD"]), int(os.environ["N"])
          log = []
          try:
              with open(os.environ["LOG"], encoding="utf-8", errors="replace") as fh:
                  log = [l.rstrip("\r\n") for l in fh]
          except OSError:
              pass
          if any(l.startswith("caught ") and ", missed " in l for l in log):
              print("the sweep finished; any failure is in its own lines above")
              raise SystemExit(0)
          if any("The suite FAILS with nothing mutated" in l for l in log):
              print("the baseline failed; that is not a timeout")
              raise SystemExit(0)
          if any(l.startswith("INFRASTRUCTURE FAILURE") for l in log):
              print("the unmutated suite did not finish, twice: an infrastructure failure, said above")
              raise SystemExit(0)
          if any("nothing to run" in l or "cannot read the diff" in l
                 or "nothing was run" in l or "--only" in l for l in log):
              print("the shard stopped before any mutation ran; see its own lines above")
              raise SystemExit(0)
          tree = ast.parse(open("mutate.py", encoding="utf-8").read(), "mutate.py")
          names = None
          for node in ast.walk(tree):
              if isinstance(node, ast.Assign) and any(
                      isinstance(t, ast.Name) and t.id == "MUTATIONS" for t in node.targets):
                  names = [e.elts[0].value for e in node.value.elts]
          mine = [n for i, n in enumerate(names) if i % total == shard]
          # In an affected run only part of the shard was due; the sweep
          # says which ("would run" is --list's word, "to run" the sweep's).
          due = None
          for l in log:
              if l.startswith("shard ") and " mutations to run" in l:
                  due = int(l.split(":")[1].split()[0])
          done = set()
          for l in log:
              for pre in ("  caught      ", "  NOT CAUGHT  "):
                  if l.startswith(pre):
                      done.add(l[len(pre):])
              if l.startswith("  SETUP FAIL  "):
                  done.add(l[len("  SETUP FAIL  "):].split(" (pattern", 1)[0])
          todo = [n for n in mine if n not in done]
          if not todo or (due is not None and len(done) >= due):
              print("no mutation is missing a result; the shard stopped some other way")
              raise SystemExit(0)
          head = (f"shard {shard}/{total} TIMED OUT, it did not finish: "
                  f"{len(done)} of its {due if due is not None else len(mine)} mutations ran to a result. "
                  "This is a timeout, not a missed mutation; re-run the shard.")
          esc = lambda s: s.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print("::error title=mutate shard timed out::" + esc(head + " Not run: " + " | ".join(todo))[:3500])
          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
              with open(summary, "a", encoding="utf-8") as fh:
                  fh.write("### " + head + "\n\n" + "\n".join("- " + n for n in todo) + "\n")
          print(head)
          for n in todo:
              print("  did not run  " + n)
          raise SystemExit(1)
          PY
      # The whole shard log, kept a week, for the run page's Artifacts
      # list; the job log cannot always be fetched from a cloud session.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutate-log-${{ matrix.os }}-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/mutate.log
          retention-days: 7
          if-no-files-found: ignore

  # One place that says which shards are red, with a link to each, in the
  # run's summary, so nobody opens the jobs one by one to find the one that failed.
  # Each red shard's own summary says why (the kind of failure and the
  # mutation), its annotations carry the same, and its log is the artifact
  # named after it. Nothing is posted to the PR, and on a PR this job is
  # green whatever it finds: the required check on main is `ci`, below.
  # After a push to main or a release tag (a whole sweep after the fact)
  # it is never silent: red opens the mutate-sweep issue and fails this
  # job, and green closes that issue (.github/scripts/sweep_issue.sh, the
  # same as weekly-mutate.yml).
  mutate-report:
    needs: [selftest, changes, mutate]
    # After a push or a tag it always runs: a red suite (so no shard ran),
    # a cancelled sweep or a broken changes job is a red whole sweep too.
    if: always() && (github.event_name == 'push' || (needs.mutate.result != 'skipped' && needs.mutate.result != 'cancelled'))
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v5
        if: github.event_name == 'push'
      - id: table
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}
          MODE: ${{ needs.changes.outputs.mode }}
          NSHARDS: ${{ needs.changes.outputs.nshards }}
          OSES: ${{ needs.changes.outputs.oses }}
          JOB_PREFIX: "mutate ("
        run: |
          gh api --paginate "repos/$REPO/actions/runs/$RUN_ID/jobs?per_page=100" \
            --jq '.jobs[] | [.name, (.conclusion // .status), .html_url] | @tsv' > "$RUNNER_TEMP/jobs.tsv"
          python3 - "$RUNNER_TEMP/jobs.tsv" <<'PY'
          import json, os, sys

          prefix, mode = os.environ["JOB_PREFIX"], os.environ.get("MODE", "")
          shards = []
          with open(sys.argv[1], encoding="utf-8") as fh:
              for line in fh:
                  parts = line.rstrip("\n").split("\t")
                  if len(parts) == 3 and parts[0].startswith(prefix):
                      shards.append(parts)
          red = [s for s in shards if s[1] not in ("success", "skipped")]
          # Every shard the changes job asked for must be here: one that
          # never got a job is red too, not quietly left out of the count.
          try:
              want = int(os.environ.get("NSHARDS") or 0) * len(json.loads(os.environ.get("OSES") or "[]"))
          except ValueError:
              want = 0
          missing = want - len(shards) if shards and want > len(shards) else 0
          total, nred = max(want, len(shards)), len(red) + missing
          if missing:
              red.append((f"{missing} of the {want} shards", "no job", ""))
          out = []
          if not shards:
              out.append("### mutate: no shard jobs were found in this run")
          elif not red:
              out.append(f"### mutate: all {total} shards green"
                         + (" (nothing this change can have broken is mutated)"
                            if mode == "none" else ""))
          else:
              out += [f"### mutate: {nred} of {total} shards red", "",
                      "| shard | result | job |", "|---|---|---|"]
              out += [f"| {n} | {c} | " + (f"[open]({u})" if u else "none") + " |" for n, c, u in red]
              out += ["",
                      "Each red shard's own summary (above, under its job) says "
                      "why: the kind of failure and the mutation or test. Its "
                      "annotations say the same, and its full log is the "
                      "artifact named `mutate-log-<os>-shard-<n>`, kept 7 days."]
          text = "\n".join(out) + "\n"
          print(text)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as fh:
              fh.write(text)
          with open(os.path.join(os.environ["RUNNER_TEMP"], "report.md"), "w", encoding="utf-8") as fh:
              fh.write(text)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"red={nred if shards else 1}\n")
          PY
      # Runs even when the table step failed: anything but a green suite,
      # a green changes job and green shards is red here.
      - name: A whole sweep after the fact is never silent
        if: always() && github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          WHAT: The whole mutation sweep after the push of ${{ github.ref_name }} (${{ github.sha }})
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          RED: ${{ steps.table.outputs.red }}
          SELFTEST: ${{ needs.selftest.result }}
          CHANGES: ${{ needs.changes.result }}
          MUTATE: ${{ needs.mutate.result }}
        run: |
          report="$RUNNER_TEMP/report.md"; [[ -f "$report" ]] || echo "### the shard table could not be made" > "$report"
          red="${RED:-1}"
          if [[ "$SELFTEST" != success || "$CHANGES" != success || "$MUTATE" != success ]]; then
            printf '\nselftest: %s, changes: %s, mutate: %s. Anything but success is a red sweep: the list was not proved.\n' "$SELFTEST" "$CHANGES" "$MUTATE" >> "$report"
            if (( red < 1 )); then red=1; fi
          fi
          bash .github/scripts/sweep_issue.sh "$WHAT" "$report" "$red"

  # The one required check on main. Green only when the suite passed on
  # both OSes, the changes job decided, and every mutate shard that had to
  # run passed; red when any of them failed, was cancelled, or did not run
  # when it should have. Skipped on a draft PR, like the shards (a draft
  # cannot be merged; marking it ready starts a fresh run with the shards in
  # it).
  # Named ci only on a PR into main (and on pushes): on any other base it
  # is ci-bench, the same checks under another name, so no check named ci
  # is ever reported for a PR that was not judged by the release gate. A
  # PR moved to main then has no ci on its head until it is pushed (or
  # closed and reopened), and branch protection waits for it.
  ci:
    name: ${{ (github.event_name == 'pull_request' && github.event.pull_request.base.ref != 'main') && 'ci-bench' || 'ci' }}
    needs: [selftest, changes, mutate]
    # Always runs, drafts included, and decides inside: a skipped required
    # check counts as passed, so ci is never skipped. A draft is red (its
    # shards have not run), and so is anything that did not succeed.
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
    steps:
      - shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SELFTEST: ${{ needs.selftest.result }}
          CHANGES: ${{ needs.changes.result }}
          MUTATE: ${{ needs.mutate.result }}
          MODE: ${{ needs.changes.outputs.mode }}
          TIER: ${{ needs.changes.outputs.tier }}
          COUNT: ${{ needs.changes.outputs.count }}
          EVENT: ${{ github.event_name }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          DRAFT: ${{ github.event.pull_request.draft }}
          GATE_FILES: ${{ needs.changes.outputs.gate_files }}
        run: |
          if [[ "$EVENT" == pull_request && "$DRAFT" == true ]]; then
            echo "::error title=draft::a draft PR is never green: its mutate shards run when it is marked ready for review"
            exit 1
          fi
          if [[ -n "$GATE_FILES" ]]; then
            echo "::error title=THIS PR EDITS THE CI ITSELF::$GATE_FILES. A PR that edits the workflows can lower its own gate, and only a person reading that diff stops it. Read it before merging."
            { echo "## THIS PR EDITS THE CI ITSELF"; echo; echo "$GATE_FILES"; echo; echo "A PR that edits the workflows can lower its own gate; only a person reading that diff stops it."; } >> "$GITHUB_STEP_SUMMARY"
          fi
          # On a PR into main this check is ci and needs the tier the
          # changes job computed for main; on any other base it is
          # ci-bench (see the job's name) and judges the same way as
          # before, with no tier.
          if [[ "$EVENT" == pull_request && "$PR_BASE_REF" == main && -z "$TIER" ]]; then
            echo "::error::a PR into main with no release gate tier: the changes job did not decide for main"
            exit 1
          fi
          echo "selftest: $SELFTEST, changes: $CHANGES, mutate: $MUTATE (mode $MODE)"
          if [[ -n "$TIER" ]]; then
            line="release gate: tier $TIER"
            if [[ "$TIER" == scoped ]]; then line="$line, $COUNT mutations"; fi
            echo "$line"; echo "### $line" >> "$GITHUB_STEP_SUMMARY"
          fi
          # A red whole sweep (its issue is open) is said on every PR, so
          # it is fixed before the next merge, as the rule has always been;
          # a release with code in it runs the whole list until it is.
          open_issue=$(gh issue list --repo "$REPO" --label mutate-sweep --state open --json number,url --jq '.[0] // empty | "#\(.number) \(.url)"' 2>/dev/null || true)
          if [[ -n "$open_issue" ]]; then
            echo "::warning title=a whole mutation sweep on main is red::fix that before merging anything else: $open_issue"
          fi
          bad=0
          [[ "$SELFTEST" == success ]] || { echo "::error::selftest is not green ($SELFTEST)"; bad=1; }
          [[ "$CHANGES" == success ]] || { echo "::error::the changes job is not green ($CHANGES)"; bad=1; }
          if [[ "$MODE" == none ]]; then
            [[ "$MUTATE" == skipped ]] || { echo "::error::mutate ran with nothing to run ($MUTATE)"; bad=1; }
            echo "nothing this change can have broken is mutated: no shard ran"
          else
            [[ "$MUTATE" == success ]] || { echo "::error::the mutate shards are not green ($MUTATE); the mutate-report job lists the red ones"; bad=1; }
          fi
          # A green ci is about main as it was when this run started. If
          # main has moved since, the release was not tested against it.
          if [[ "$EVENT" == pull_request && "$PR_BASE_REF" == main ]]; then
            head=$(gh api "repos/$REPO/commits/main" --jq .sha 2>/dev/null || true)
            if [[ -z "$head" || "$head" != "$PR_BASE_SHA" ]]; then
              echo "::error title=main has moved::this run tested against main at $PR_BASE_SHA, main is now ${head:-unknown}: merge main into the release branch (or rebase) and let it run again"
              bad=1
            fi
          fi
          if (( bad )); then exit 1; fi
          echo "ci: green"
