name: selftest

# The per-PR gate. What runs when, how long it takes and what a failure means
# is written up in TESTING.md; the short version:
#
#   selftest   every PR, every push to main, every tag: the whole suite on
#              ubuntu and windows, about 4 minutes each
#   changes    works out which mutations the diff can have changed the
#              result of (mutate.py --changed), and how many shards that
#              needs: none for a doc, a launcher or this workflow; a few for
#              one file; 32 for a release tag or a change with no base
#   mutate     those shards, ubuntu (a release tag: ubuntu and windows).
#              This job does not exist at all when there is nothing to run.
#   ci         the ONE required check on main: green when selftest, changes
#              and every mutate shard are green, or when mutate had nothing
#              to run. Branch protection names this job, not the shards, so
#              the shard count can follow the work.
#
# A PR runs once, as a pull_request. Pushes run only for main and for release
# tags, so a PR branch is not tested twice. ready_for_review is listed with
# the three GitHub gives by default because that is the moment a draft's
# mutate job, skipped while it stays a draft, is first allowed to run.
on:
  push:
    branches: [main]
    tags: ["**"]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

# A newer push to the same PR makes the older run pointless, so it is
# cancelled. Every push to main and every tag gets a group of its own: they
# are never cancelled, and never queue behind mutate.py either.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The Windows show PC is the version that must work; ubuntu is the cheap
  # second opinion. macOS is no longer tested here: the Dollywood Mac is
  # frozen at gpl-2026.09.15.10 and main no longer keeps GPL behavior.
  selftest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      # pillow: the Stream Deck's key drawing (ltcplay/streamdeck.py), so
      # its pixel test runs here too. The suite also passes without it.
      - run: python -m pip install numpy zstandard tzdata pillow
      # selftest.py writes each failure as an annotation and its totals to
      # the job summary. The whole log is kept as an artifact for a week,
      # since the job log cannot always be fetched (a cloud session's proxy
      # blocks the log store). pipefail (bash's default in Actions) keeps
      # selftest.py's exit code through tee.
      - shell: bash
        run: python -u selftest.py 2>&1 | tee "$RUNNER_TEMP/selftest.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selftest-log-${{ matrix.os }}
          path: ${{ runner.temp }}/selftest.log
          retention-days: 7
          if-no-files-found: ignore

  # Decides what the mutate shards do:
  #   mode=full      a release tag: every mutation, ubuntu and windows, 32
  #                  shards each
  #   mode=affected  a PR or a push to main with a base to diff against:
  #                  each shard runs `mutate.py --changed BASE`, which picks
  #                  the mutations the diff can have changed the result of
  #                  (the rules are in mutate.py, select_affected(), and
  #                  TESTING.md), so the list of files to watch can never
  #                  drift from the list of files mutate.py breaks. The
  #                  shard count follows the selection: about 12 mutations
  #                  a shard (40 minutes), 32 at most
  #   mode=none      that selection is empty (a doc, a launcher, the brand,
  #                  this workflow): no shard job is started at all
  # A push with no usable base (a first push, a rewritten one) runs
  # everything rather than guess.
  #
  # The newest catchers file (which test caught each mutation, written by
  # the weekly sweep) is fetched when there is one, so a changed or deleted
  # test re-runs exactly the mutations it guarded instead of everything, or
  # nothing. Without one, a deleted test still means the whole list.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      mode: ${{ steps.decide.outputs.mode }}
      base: ${{ steps.decide.outputs.base }}
      oses: ${{ steps.decide.outputs.oses }}
      shards: ${{ steps.decide.outputs.shards }}
      nshards: ${{ steps.decide.outputs.nshards }}
      catchers: ${{ steps.catchers.outputs.id }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # The artifact's id is passed to the shards so every job in this run
      # reads the same file, even if a weekly sweep finishes meanwhile.
      - id: catchers
        name: Fetch the newest catchers file from the weekly sweep
        shell: bash
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -u
          id=$(gh api "repos/$REPO/actions/artifacts?name=catchers&per_page=1" \
                 --jq '.artifacts[] | select(.expired == false) | .id' | head -1)
          if [[ -z "$id" ]]; then
            echo "no catchers artifact yet: a changed test is judged without one"
            exit 0
          fi
          gh api "repos/$REPO/actions/artifacts/$id/zip" > "$RUNNER_TEMP/catchers.zip"
          mkdir -p "$RUNNER_TEMP/catchers"
          unzip -o -q "$RUNNER_TEMP/catchers.zip" -d "$RUNNER_TEMP/catchers"
          if [[ -f "$RUNNER_TEMP/catchers/catchers.json" ]]; then
            python3 -c "import json,sys; d=json.load(open(sys.argv[1])); print(len(d), 'catchers from artifact', sys.argv[2])" \
              "$RUNNER_TEMP/catchers/catchers.json" "$id"
            echo "path=$RUNNER_TEMP/catchers/catchers.json" >> "$GITHUB_OUTPUT"
            echo "id=$id" >> "$GITHUB_OUTPUT"
          fi
      - id: decide
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
          CATCHERS: ${{ steps.catchers.outputs.path }}
        run: |
          set -u
          shards_json() {    # 0..N-1 as a JSON list
            python3 -c "import json,sys; print(json.dumps(list(range(int(sys.argv[1])))))" "$1"
          }
          say() {
            echo "$1"
            { echo "mode=$2"; echo "base=$3"; echo "oses=$4"; echo "nshards=$5";
              echo "shards=$(shards_json "$5")"; } >> "$GITHUB_OUTPUT"
            exit 0
          }
          if [[ "$REF" == refs/tags/* ]]; then
            say "release tag: every mutation, ubuntu and windows, 32 shards each" full "" '["ubuntu-latest","windows-latest"]' 32
          fi
          if [[ "$EVENT" == pull_request ]]; then base="$PR_BASE"; else base="$BEFORE"; fi
          if [[ -z "$base" || "$base" =~ ^0+$ ]] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            say "no base to compare against: every mutation, ubuntu, 32 shards" full "" '["ubuntu-latest"]' 32
          fi
          # mutate.py --list needs no numpy: it stops before the baseline.
          # Exit 0 with "nothing to run" means the selection is empty.
          out="$RUNNER_TEMP/selection.txt"
          narrow=()
          if [[ -n "$CATCHERS" ]]; then narrow=(--catchers "$CATCHERS"); fi
          if ! python3 mutate.py --changed "$base" "${narrow[@]}" --list > "$out"; then
            cat "$out"
            echo "::error::mutate.py could not work out what this change affects"
            exit 1
          fi
          grep -v '^  would run' "$out" || true
          n=$(grep -c '^  would run' "$out" || true)
          echo "$n mutations would run"
          if grep -q 'nothing to run' "$out"; then
            say "nothing this change can have broken is mutated: no shard runs" none "$base" '["ubuntu-latest"]' 1
          fi
          # About 12 mutations a shard: one suite run each plus a short
          # second look, about 40 minutes a shard with the baseline.
          k=$(( (n + 11) / 12 )); if (( k < 1 )); then k=1; fi; if (( k > 32 )); then k=32; fi
          say "the $n affected mutations, ubuntu, $k shard(s)" affected "$base" '["ubuntu-latest"]' "$k"

  # Thirty-two shards of a full sweep on every push to a draft PR is real
  # money spent on a diff that is still being written: the mutate jobs are
  # skipped while the PR is a draft and run for the first time when it is
  # marked ready for review; selftest itself still runs on every push,
  # drafts included. With nothing to run (mode none) there is no job here at
  # all, not 32 empty ones.
  mutate:
    needs: changes
    if: needs.changes.outputs.mode != 'none' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.changes.outputs.oses) }}
        shard: ${{ fromJSON(needs.changes.outputs.shards) }}
    runs-on: ${{ matrix.os }}
    # Sized for a full sweep of about 860 mutations in 32 shards: 27 a
    # shard, each one suite run (130 to 200 s) plus a second look at the
    # failing tests alone (seconds), plus the baseline: 60 to 100 minutes.
    # 300 leaves room for a shard where every second look falls back to a
    # whole second run. The sweep step stops itself 15 minutes before this
    # limit so the job is never killed from outside with nothing said.
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v5
        with:
          # --changed reads the base revision's mutate.py, selftest.py and
          # expected-miss list out of git.
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      # pillow too, the same list as the selftest job: without it the
      # Stream Deck pixel tests skip themselves and the deck mutations in
      # streamdeck.py read NOT CAUGHT in every sweep here while any box
      # with Pillow catches them (PR #43, #46 and #49, shards 14 and 15).
      - run: python -m pip install numpy zstandard tzdata pillow
      - name: Fetch the catchers file the changes job used
        if: needs.changes.outputs.catchers != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ID: ${{ needs.changes.outputs.catchers }}
        run: |
          gh api "repos/$REPO/actions/artifacts/$ID/zip" > "$RUNNER_TEMP/catchers.zip"
          mkdir -p "$RUNNER_TEMP/catchers"
          unzip -o -q "$RUNNER_TEMP/catchers.zip" -d "$RUNNER_TEMP/catchers"
          test -f "$RUNNER_TEMP/catchers/catchers.json"
      # The expected-miss list is the mutations only the real show folder
      # can catch. Any other miss, any listed one that is now caught, and any
      # SETUP FAIL fails the job. The step has its own limit, 15 minutes
      # under the job's, so that when a shard runs out of time the step
      # after it still runs and can say so. pipefail (bash's default in
      # Actions) keeps mutate.py's exit code through tee.
      - id: sweep
        shell: bash
        timeout-minutes: 285
        env:
          MODE: ${{ needs.changes.outputs.mode }}
          BASE: ${{ needs.changes.outputs.base }}
          N: ${{ needs.changes.outputs.nshards }}
          CATCHERS: ${{ needs.changes.outputs.catchers }}
        run: |
          narrow=()
          if [[ "$MODE" == affected ]]; then
            narrow=(--changed "$BASE")
            if [[ -n "$CATCHERS" && -f "$RUNNER_TEMP/catchers/catchers.json" ]]; then
              narrow+=(--catchers "$RUNNER_TEMP/catchers/catchers.json")
            fi
          fi
          python -u mutate.py --shard ${{ matrix.shard }}/$N --expected mutate_expected_misses.txt "${narrow[@]}" 2>&1 | tee "$RUNNER_TEMP/mutate.log"
      # Tells a shard that ran out of time apart from a missed mutation:
      # mutate.py --unfinished names every mutation of the shard with no
      # result in the log, as an annotation and in the job summary.
      - name: Report a shard that ran out of time
        if: always() && steps.sweep.outcome != 'success' && steps.sweep.outcome != 'skipped'
        shell: bash
        env:
          N: ${{ needs.changes.outputs.nshards }}
        run: python mutate.py --unfinished "$RUNNER_TEMP/mutate.log" --shard ${{ matrix.shard }}/$N
      # The whole shard log, kept a week, for the run page's Artifacts
      # list; the job log cannot always be fetched from a cloud session.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutate-log-${{ matrix.os }}-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/mutate.log
          retention-days: 7
          if-no-files-found: ignore

  # One place that says which shards are red, with a link to each, in the
  # run's summary, so nobody opens the jobs one by one to find the one that
  # failed. Each red shard's own summary says why (the kind of failure and
  # the mutation), its annotations carry the same, and its log is the
  # artifact named after it. Nothing is posted to the PR, and this job is
  # green whatever it finds: the required check is `ci`, below.
  mutate-report:
    needs: [changes, mutate]
    if: always() && needs.mutate.result != 'skipped' && needs.mutate.result != 'cancelled'
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}
          MODE: ${{ needs.changes.outputs.mode }}
          JOB_PREFIX: "mutate ("
        run: |
          gh api --paginate "repos/$REPO/actions/runs/$RUN_ID/jobs?per_page=100" \
            --jq '.jobs[] | [.name, (.conclusion // .status), .html_url] | @tsv' > "$RUNNER_TEMP/jobs.tsv"
          python3 - "$RUNNER_TEMP/jobs.tsv" <<'PY'
          import os, sys

          prefix, mode = os.environ["JOB_PREFIX"], os.environ.get("MODE", "")
          shards = []
          with open(sys.argv[1], encoding="utf-8") as fh:
              for line in fh:
                  parts = line.rstrip("\n").split("\t")
                  if len(parts) == 3 and parts[0].startswith(prefix):
                      shards.append(parts)
          red = [s for s in shards if s[1] not in ("success", "skipped")]
          out = []
          if not shards:
              out.append("### mutate: no shard jobs were found in this run")
          elif not red:
              out.append(f"### mutate: all {len(shards)} shards green")
          else:
              out += [f"### mutate: {len(red)} of {len(shards)} shards red", "",
                      "| shard | result | job |", "|---|---|---|"]
              out += [f"| {n} | {c} | [open]({u}) |" for n, c, u in red]
              out += ["",
                      "Each red shard's own summary (above, under its job) says "
                      "why: the kind of failure and the mutation or test. Its "
                      "annotations say the same, and its full log is the "
                      "artifact named `mutate-log-<os>-shard-<n>`, kept 7 days."]
          text = "\n".join(out) + "\n"
          print(text)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as fh:
              fh.write(text)
          PY

  # The one required check. Green only when the suite passed on both OSes,
  # the changes job decided, and every mutate shard that had to run passed;
  # red when any of them failed, was cancelled, or did not run when it
  # should have. Skipped on a draft PR, like the shards (a draft cannot be
  # merged; marking it ready starts a fresh run with the shards in it).
  ci:
    needs: [selftest, changes, mutate]
    if: always() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
    steps:
      - shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SELFTEST: ${{ needs.selftest.result }}
          CHANGES: ${{ needs.changes.result }}
          MUTATE: ${{ needs.mutate.result }}
          MODE: ${{ needs.changes.outputs.mode }}
        run: |
          echo "selftest: $SELFTEST, changes: $CHANGES, mutate: $MUTATE (mode $MODE)"
          # A red weekly sweep (its issue is open) is said on every PR, so
          # it is fixed before the next merge, as the rule has always been.
          open_issue=$(gh issue list --repo "$REPO" --label mutate-sweep --state open --json number,url --jq '.[0] | "#\(.number) \(.url)"' 2>/dev/null || true)
          if [[ -n "$open_issue" ]]; then
            echo "::warning title=the weekly mutation sweep is red::fix that before merging anything else: $open_issue"
          fi
          bad=0
          [[ "$SELFTEST" == success ]] || { echo "::error::selftest is not green ($SELFTEST)"; bad=1; }
          [[ "$CHANGES" == success ]] || { echo "::error::the changes job is not green ($CHANGES)"; bad=1; }
          if [[ "$MODE" == none ]]; then
            [[ "$MUTATE" == skipped ]] || { echo "::error::mutate ran with nothing to run ($MUTATE)"; bad=1; }
            echo "nothing this change can have broken is mutated: no shard ran"
          else
            [[ "$MUTATE" == success ]] || { echo "::error::the mutate shards are not green ($MUTATE); the mutate-report job lists the red ones"; bad=1; }
          fi
          if (( bad )); then exit 1; fi
          echo "ci: green"
