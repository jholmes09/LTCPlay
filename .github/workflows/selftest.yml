name: selftest

# The per-PR gate. What runs when, how long it takes and what a failure means
# is written up in TESTING.md; the short version (the CI diet, 2026-11-13):
#
#   selftest   every PR, every push to main, every tag: the whole suite on
#              ubuntu and windows, about 15 to 20 minutes on ubuntu and
#              25 to 35 on windows (2026-11-03), limits 45 and 60
#   changes    says what the mutation sweep would cover for this change
#              (mutate.py --changed: the mutations of the files the diff
#              touches, every flamesafe, conductor and flame link mutation
#              when a safety file is touched, new or edited mutations, and
#              whatever a deleted test guarded) and decides whether shards
#              run here at all (.github/scripts/mutate_plan.py):
#                a PR into main (a release): yes, those mutations plus the
#                  whole safety core, on ubuntu;
#                a PR into bench-build, a PR stacked on another PR, a push
#                  to main, a release tag: no. The nightly sweep
#                  (nightly-mutate.yml) runs what bench-build changed in the
#                  last day, the weekly sweep (weekly-mutate.yml) runs the
#                  whole list.
#   mutate     those shards, ubuntu only. No shard job is started at all
#              when there is nothing to run. They start only once both
#              selftest jobs are green (a red suite makes every mutation
#              look caught, so the shards would measure nothing), and since
#              that green selftest already ran the whole suite on this
#              commit, a shard does not run it again: each copy runs a short
#              sanity run instead (mutate.py --trust-baseline). How many run
#              at once is the account's job slots minus a reserve kept for
#              other PRs (mutate_plan.py).
#
# On a PR into bench-build the required checks are selftest (ubuntu-latest),
# selftest (windows-latest), changes and installer (windows-app.yml), as
# before; none of them waits for a shard.
#
# A PR runs once, as a pull_request. Pushes run only for main and for release
# tags, so a PR branch is not tested twice. ready_for_review is listed with
# the three GitHub gives by default because that is the moment a draft's
# mutate job, skipped while it stays a draft, is first allowed to run.
on:
  push:
    branches: [main]
    tags: ["**"]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

# A newer push to the same PR makes the older run pointless, so it is
# cancelled, shards and all (the group is the workflow and the PR's ref,
# refs/pull/N/merge, so it never touches another PR). Every push to main and
# every tag gets a group of its own: they are never cancelled, and never
# queue behind mutate.py either.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The Windows show PC is the version that must work; ubuntu is the cheap
  # second opinion. macOS is no longer tested here: the Dollywood Mac is
  # frozen at gpl-2026.09.15.10 and main no longer keeps GPL behavior.
  selftest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # Measured 2026-11-03: ubuntu 16 to 20 minutes, windows 27 to 35 (one
    # good run was cancelled at its old 35 minute limit). The limits leave
    # room for a slow runner; a hung test still ends the job.
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 60 || 45 }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/workflows/selftest.yml
      # pillow: the Stream Deck's key drawing (ltcplay/streamdeck.py), so
      # its pixel test runs here too. The suite also passes without it.
      - run: python -m pip install numpy zstandard tzdata pillow
      # selftest.py writes each failure as an annotation and its totals to
      # the job summary. The whole log is kept as an artifact for a week,
      # since the job log cannot always be fetched (a cloud session's proxy
      # blocks the log store). pipefail (bash's default in Actions) keeps
      # selftest.py's exit code through tee.
      - shell: bash
        run: python -u selftest.py 2>&1 | tee "$RUNNER_TEMP/selftest.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selftest-log-${{ matrix.os }}
          path: ${{ runner.temp }}/selftest.log
          retention-days: 7
          if-no-files-found: ignore

  # Decides what the mutate shards do (.github/scripts/mutate_plan.py says
  # which events run shards and how many; the selection is mutate.py's):
  #   mode=affected  a PR into main: each shard runs `mutate.py --changed
  #                  BASE --with-core`, the mutations the diff can have
  #                  changed the result of (select_affected() in mutate.py
  #                  and TESTING.md) plus every flamesafe, conductor and
  #                  flame link mutation, whatever the diff
  #   mode=full      a PR into main with no usable base: everything
  #   mode=none      anything else, or an empty selection: no shard job at
  #                  all
  # The selection is printed on every run, a PR into bench-build included,
  # so its author sees what the nightly sweep will run for it. A mutate.py
  # that cannot work the selection out turns this job red.
  changes:
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.decide.outputs.mode }}
      base: ${{ steps.decide.outputs.base }}
      core: ${{ steps.decide.outputs.core }}
      oses: ${{ steps.decide.outputs.oses }}
      shards: ${{ steps.decide.outputs.shards }}
      nshards: ${{ steps.decide.outputs.nshards }}
      parallel: ${{ steps.decide.outputs.parallel }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: decide
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BASE_REF: ${{ github.base_ref }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
          CI_JOB_SLOTS: ${{ vars.CI_JOB_SLOTS }}
          CI_SLOT_RESERVE: ${{ vars.CI_SLOT_RESERVE }}
          MUTATE_SHARDS: ${{ vars.MUTATE_SHARDS }}
        run: |
          set -euo pipefail
          python3 .github/scripts/mutate_plan.py mode "$EVENT" "$REF" "$BASE_REF" > "$RUNNER_TEMP/mode.txt"
          mode=$(sed -n 's/^mode=//p' "$RUNNER_TEMP/mode.txt")
          sed -n 's/^why=//p' "$RUNNER_TEMP/mode.txt"
          say() {    # mode, base, mutation count, core flag
            python3 .github/scripts/mutate_plan.py size "$3" > "$RUNNER_TEMP/size.txt"
            { echo "mode=$1"; echo "base=$2"; echo "core=$4"; echo 'oses=["ubuntu-latest"]';
              cat "$RUNNER_TEMP/size.txt"; } >> "$GITHUB_OUTPUT"
            cat "$RUNNER_TEMP/size.txt"
            exit 0
          }
          if [[ "$REF" == refs/tags/* ]]; then say none "" 0 ""; fi
          if [[ "$EVENT" == pull_request ]]; then base="$PR_BASE"; else base="$BEFORE"; fi
          if [[ -z "$base" || "$base" =~ ^0+$ ]] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            if [[ "$mode" == affected ]]; then
              total=$(python3 mutate.py --list | grep -c '^  would run' || true)
              echo "no base to compare against: every mutation ($total)"
              say full "" "$total" ""
            fi
            echo "no base to compare against; no shards run here"
            say none "" 0 ""
          fi
          # The safety core always runs on a PR into main. mutate.py says so
          # with --with-core; a PR may not drop that option from mutate.py
          # once its base has it (the PR's own mutate.py does the selecting).
          core=""
          if [[ "$mode" != affected ]]; then
            :
          elif grep -q -- '"--with-core"' mutate.py; then
            core="--with-core"
          elif git show "$base:mutate.py" 2>/dev/null | grep -q -- '"--with-core"'; then
            echo "::error::mutate.py lost --with-core, which its base has: the safety core would not run"
            exit 1
          fi
          # mutate.py --list needs no numpy: it stops before any suite runs.
          # Exit 0 with "nothing to run" means the selection is empty.
          out="$RUNNER_TEMP/selection.txt"
          if ! python3 mutate.py --changed "$base" ${core:+"$core"} --list > "$out"; then
            cat "$out"
            echo "::error::mutate.py could not work out what this change affects"
            exit 1
          fi
          grep -v '^  would run' "$out" || true
          n=$(grep -c '^  would run' "$out" || true)
          echo "$n mutations in this change's selection"
          if [[ "$mode" != affected ]]; then
            echo "no shards run for this event (above); the selection is for reading only"
            say none "$base" 0 ""
          fi
          if grep -q 'nothing to run' "$out" || (( n == 0 )); then
            echo "nothing this change can have broken is mutated: no shard runs"
            say none "$base" 0 ""
          fi
          say affected "$base" "$n" "$core"

  # The account runs a fixed number of jobs at once (20 on the free plan),
  # shared by every workflow and every PR. So the shards:
  #   - start only for a PR into main that has something to mutate (no job
  #     at all for mode none, not empty ones), as many as the selection
  #     needs (the changes job, mutate_plan.py);
  #   - start only after both selftest jobs are green;
  #   - run at most CI_JOB_SLOTS minus CI_SLOT_RESERVE at once (16 on the
  #     free plan), so a release never takes the slots a PR's selftest
  #     needs;
  #   - are skipped while the PR is a draft and run for the first time
  #     when it is marked ready for review; selftest itself still runs on
  #     every push, drafts included.
  mutate:
    needs: [changes, selftest]
    if: needs.changes.outputs.mode != 'none' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(needs.changes.outputs.parallel) }}
      matrix:
        os: ${{ fromJSON(needs.changes.outputs.oses) }}
        shard: ${{ fromJSON(needs.changes.outputs.shards) }}
    runs-on: ${{ matrix.os }}
    # A shard holds at most 45 mutations (mutate_plan.py). Measured on
    # ubuntu with fail fast, catcher hints and --jobs 3 (the 7 days to
    # 2026-11-13, 536 finished shards): about 2.8 minutes of a shard a
    # mutation, so 45 take about 125 minutes; the old 15 to 19 minute
    # baseline is now a sanity run of a minute or two. The limits stay as
    # a backstop only: 355 is under GitHub's 360 cap. The sweep step stops
    # itself 15 minutes before this limit so the job is never killed from
    # outside with nothing said.
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v5
        with:
          # --changed reads the base revision's mutate.py, selftest.py and
          # expected-miss list out of git.
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/workflows/selftest.yml
      # The same packages as the selftest job, pillow included: without it
      # the Stream Deck pixel tests skip themselves, and the three "Deck
      # latched" mutations in streamdeck.py were NOT CAUGHT in every sweep
      # here while they were caught on any box with Pillow (PR #43, #46 and
      # #49, shards 14 and 15). selftest.py now fails in CI when Pillow is
      # missing, so this line cannot drift from the one above again.
      - run: python -m pip install numpy zstandard tzdata pillow
      # The expected-miss list is the mutations only the real show folder
      # can catch. Any other miss, any listed one that is now caught, and any
      # SETUP FAIL fails the job. Each mutated run stops after its first
      # failing test, and runs the test that caught that mutation last time
      # first (--hints; mutate.py says when such a run counts). Ubuntu runs
      # three mutations at once (--jobs 3), each in its own copy of the tree.
      # --trust-baseline: the selftest job of this run already passed the
      # whole suite on this commit on this OS (this job needs it), so a copy
      # does not run the whole suite again before its first mutation. It
      # runs the tests its mutations are hinted to first (a minute or two),
      # and any test a caught mutation stopped in is proved green with
      # nothing mutated in that copy, or the copy runs its whole baseline
      # after all (mutate.py, _sweep). 1200 s is the suite's time on ubuntu
      # with three copies at once, rounded up; a mutant's suite is stopped
      # at three times that. A mutate.py without the option (main before
      # the diet's release) runs its whole baselines, as before.
      # The step has its own limit, 15 minutes under the job's, so that
      # when a shard runs out of time the step after it still runs and can
      # say so. pipefail (bash's default in Actions) keeps mutate.py's exit
      # code through tee.
      - id: sweep
        shell: bash
        timeout-minutes: 340
        env:
          MODE: ${{ needs.changes.outputs.mode }}
          BASE: ${{ needs.changes.outputs.base }}
          CORE: ${{ needs.changes.outputs.core }}
          N: ${{ needs.changes.outputs.nshards }}
        run: |
          narrow=()
          if [[ "$MODE" == affected ]]; then narrow=(--changed "$BASE" ${CORE:+"$CORE"}); fi
          trust=()
          if grep -q -- '"--trust-baseline"' mutate.py; then trust=(--trust-baseline 1200); fi
          python -u mutate.py --shard "${{ matrix.shard }}/$N" --expected mutate_expected_misses.txt --hints mutate_catchers.json --jobs ${{ matrix.os == 'ubuntu-latest' && 3 || 1 }} "${narrow[@]}" "${trust[@]}" 2>&1 | tee "$RUNNER_TEMP/mutate.log"
      # Tells a shard that ran out of time apart from a missed mutation. A
      # miss prints NOT CAUGHT or UNEXPECTED MISS and the sweep reaches its
      # "caught N, missed M" line. A shard that ran out of time never reaches
      # that line, so this names every mutation of the shard that has no
      # result in the log. The mutation being run when the clock stopped is
      # one of them: its result is unknown, not "caught".
      - name: Report a shard that ran out of time
        if: always() && steps.sweep.outcome != 'success' && steps.sweep.outcome != 'skipped'
        shell: bash
        env:
          SHARD: ${{ matrix.shard }}
          N: ${{ needs.changes.outputs.nshards }}
          LOG: ${{ runner.temp }}/mutate.log
        run: python3 .github/scripts/shard_timeout.py
      # The whole shard log, kept a week, for the run page's Artifacts
      # list; the job log cannot always be fetched from a cloud session.
      # An upload that fails is not a mutation result: run 43032050727's
      # shard 30 caught 45 of 45 and went red on the artifact store alone.
      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: mutate-log-${{ matrix.os }}-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/mutate.log
          retention-days: 7
          if-no-files-found: ignore

  # One place that says which shards are red, with a link to each, in the
  # run's summary, so nobody opens the jobs one by one to find the one that failed.
  # Each red shard's own summary says why (the kind of failure and the
  # mutation), its annotations carry the same, and its log is the artifact
  # named after it. Nothing is posted to the PR, and this job is green
  # whatever it finds: the required checks are the shards themselves.
  mutate-report:
    needs: [changes, mutate]
    if: always() && needs.mutate.result != 'skipped' && needs.mutate.result != 'cancelled'
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}
          MODE: ${{ needs.changes.outputs.mode }}
          NSHARDS: ${{ needs.changes.outputs.nshards }}
          OSES: ${{ needs.changes.outputs.oses }}
          JOB_PREFIX: "mutate ("
        run: |
          gh api --paginate "repos/$REPO/actions/runs/$RUN_ID/jobs?per_page=100" \
            --jq '.jobs[] | [.name, (.conclusion // .status), .html_url] | @tsv' > "$RUNNER_TEMP/jobs.tsv"
          python3 - "$RUNNER_TEMP/jobs.tsv" <<'PY'
          import json, os, sys

          prefix, mode = os.environ["JOB_PREFIX"], os.environ.get("MODE", "")
          shards = []
          with open(sys.argv[1], encoding="utf-8") as fh:
              for line in fh:
                  parts = line.rstrip("\n").split("\t")
                  if len(parts) == 3 and parts[0].startswith(prefix):
                      shards.append(parts)
          red = [s for s in shards if s[1] not in ("success", "skipped")]
          # Every shard the changes job asked for must be here: one that
          # never got a job is red too, not quietly left out of the count.
          try:
              want = int(os.environ.get("NSHARDS") or 0) * len(json.loads(os.environ.get("OSES") or "[]"))
          except ValueError:
              want = 0
          missing = want - len(shards) if shards and want > len(shards) else 0
          total, nred = max(want, len(shards)), len(red) + missing
          if missing:
              red.append((f"{missing} of the {want} shards", "no job", ""))
          out = []
          if not shards:
              out.append("### mutate: no shard jobs were found in this run")
          elif not red:
              out.append(f"### mutate: all {total} shards green"
                         + (" (nothing this change can have broken is mutated)"
                            if mode == "none" else ""))
          else:
              out += [f"### mutate: {nred} of {total} shards red", "",
                      "| shard | result | job |", "|---|---|---|"]
              out += [f"| {n} | {c} | " + (f"[open]({u})" if u else "none") + " |" for n, c, u in red]
              out += ["",
                      "Each red shard's own summary (above, under its job) says "
                      "why: the kind of failure and the mutation or test. Its "
                      "annotations say the same, and its full log is the "
                      "artifact named `mutate-log-<os>-shard-<n>`, kept 7 days."]
          text = "\n".join(out) + "\n"
          print(text)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as fh:
              fh.write(text)
          PY
