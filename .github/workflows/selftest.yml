name: selftest

# A PR runs once, as a pull_request. Pushes run only for main and for release
# tags, so a PR branch is no longer tested twice.
on:
  push:
    branches: [main, windows-compat-ci]  # TEMP: branch entry removed before the PR
    tags: ["**"]
  pull_request:

permissions:
  contents: read

# A newer push to the same PR makes the older run pointless, so it is
# cancelled. Every push to main and every tag gets a group of its own: they
# are never cancelled, and never queue behind mutate.py either.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The Mac build and the GPL show keep working, and Windows has to as well.
  # Every PR and every push proves all three.
  selftest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install numpy zstandard tzdata
      # TEMP: how late does a 20ms sleep wake on this runner?
      - name: timer check (porting aid)
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/t.py" <<'PY'
          import time
          ts = []
          for _ in range(200):
              t0 = time.monotonic(); time.sleep(0.02); ts.append(time.monotonic() - t0)
          ts.sort()
          print("sleep(0.02): p50 %.4f p90 %.4f p99 %.4f max %.4f" % (ts[100], ts[180], ts[198], ts[-1]))
          PY
          python "$RUNNER_TEMP/t.py"
          if command -v taskpolicy >/dev/null; then taskpolicy -l 0 -t 0 python "$RUNNER_TEMP/t.py"; fi
      - run: python -u selftest.py

  # TEMP (porting aid, removed before the PR): the suite five times over on
  # the slowest runner, to flush out timing flakes.
  macos-stress:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install numpy zstandard tzdata
      - shell: bash
        run: |
          bad=0
          for i in 1 2 3 4 5; do
            python -u selftest.py > "run$i.txt" 2>&1 || bad=$((bad+1))
            echo "run $i: $(tail -1 "run$i.txt")"
            grep -E "^  FAIL|Traceback" "run$i.txt" || true
          done
          echo "failed runs: $bad of 5"
          [ "$bad" = 0 ]

  # mutate.py is about 2.5 hours of runner time per OS, so it runs where it
  # pays for itself:
  #   ubuntu   on a release tag, and on any PR or push to main that changes
  #            trigger.py, output.py, player.py or session.py (CLAUDE.md), or
  #            mutate.py, selftest.py or the expected-miss list
  #   windows  on a release tag only
  #   macOS    never here (billed at 10x); it is run on the show Mac, with
  #            the real renders, where every mutation has to be caught
  # Each run is split five ways so the wall time stays under 45 minutes.
  changes:
    runs-on: ubuntu-latest
    outputs:
      oses: ${{ steps.decide.outputs.oses }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: decide
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
          HEAD_MSG: ${{ github.event.head_commit.message }}
        run: |
          set -u
          say() { echo "$1"; echo "oses=$2" >> "$GITHUB_OUTPUT"; exit 0; }
          watched='^(ltcplay/(trigger|output|player|session)\.py|mutate\.py|selftest\.py|mutate_expected_misses\.txt)$'
          if [[ "$REF" == refs/tags/* ]]; then
            say "release tag: ubuntu and windows" '["ubuntu-latest","windows-latest"]'
          fi
          # TEMP: on the porting branch, only a commit that asks for it.
          if [[ "$REF" == refs/heads/windows-compat-ci ]]; then
            [[ "$HEAD_MSG" == *"[mutate]"* ]] && \
              say "porting branch: asked for" '["ubuntu-latest","windows-latest"]'
            say "porting branch: not asked for" '[]'
          fi
          if [[ "$EVENT" == pull_request ]]; then base="$PR_BASE"; else base="$BEFORE"; fi
          # No usable base (a first push, a rewritten one): run it rather
          # than guess.
          if [[ -z "$base" || "$base" =~ ^0+$ ]] || \
             ! files=$(git diff --name-only "$base" "$GITHUB_SHA"); then
            say "no base to compare against: ubuntu" '["ubuntu-latest"]'
          fi
          echo "changed:"; echo "$files" | sed 's/^/  /'
          if echo "$files" | grep -Eq "$watched"; then
            say "a watched file changed: ubuntu" '["ubuntu-latest"]'
          fi
          say "nothing mutate.py proves has changed" '[]'

  mutate:
    needs: changes
    if: needs.changes.outputs.oses != '[]'
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.changes.outputs.oses) }}
        shard: [0, 1, 2, 3, 4]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install numpy zstandard tzdata
      # The expected-miss list is the mutations only the real show folder
      # can catch. Any other miss, any listed one that is now caught, and any
      # SETUP FAIL fails the job.
      - run: python -u mutate.py --shard ${{ matrix.shard }}/5 --expected mutate_expected_misses.txt
