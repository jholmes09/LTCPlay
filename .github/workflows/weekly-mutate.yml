name: weekly mutate

# The whole mutation list, once a week, on main. The per-PR gate
# (selftest.yml) runs only the mutations a diff can have changed the result
# of; this is the sweep that proves the rest is still caught, so a test
# weakened without being renamed, or a change in one file that silenced a
# test of another, shows here within the week and never reaches a release
# tag unseen (a tag runs the whole list too, on ubuntu and windows).
#
# Run it by hand from the Actions tab (Run workflow) before a tech build or
# whenever a full proof is wanted, choosing the OS. Each ubuntu shard takes
# about 2 to 2.5 hours (45 mutations). The account runs at most 20 jobs at
# once, shared with every PR's selftest and installer, so the sweep runs at
# most 16 shards at a time (max-parallel below) and leaves 4 slots for PRs:
# every one of the 96 shards still runs, in 6 waves, so a ubuntu sweep
# takes 11 to 14 hours of wall time (both OSes, about twice that).
# Starting the workflow again while a sweep runs cancels the older sweep,
# on any branch: a new start means the old one's result is no longer
# wanted, and two sweeps at once would take 32 slots. A red sweep is never
# silent: the report job opens an issue labelled `mutate-sweep` (or adds to
# the open one) naming the red shards with links, and closes it when a
# later sweep is green. A failure here is a NOT CAUGHT mutation (the suite
# stayed green with that line broken: strengthen the test), an UNEXPECTED
# MISS or NOW CAUGHT against mutate_expected_misses.txt, a SETUP FAIL (the
# mutation's text no longer matches the code: refresh it), or a shard that
# ran out of time (re-run it). TESTING.md has the longer version.
on:
  schedule:
    # Sundays 07:12 UTC, 03:12 Eastern: after the week's merges, before the
    # week's work.
    - cron: "12 7 * * 0"
  workflow_dispatch:
    inputs:
      os:
        description: "Where to run the whole list"
        type: choice
        default: ubuntu-latest
        options: [ubuntu-latest, windows-latest, both]

permissions:
  contents: read

# One scheduled sweep at a time and one manual sweep at a time, in two
# groups, so a manual run (on any branch) never cancels the Sunday sweep of
# main and the Sunday sweep never cancels a manual one. A newer start of
# the same kind cancels the older (a sweep that overruns a week gives way
# to the next Sunday's). Both at once can hold 32 job slots for a while;
# that is the price of the Sunday sweep never being silently dropped. A
# cancelled sweep reports red (below).
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      oses: ${{ steps.pick.outputs.oses }}
      shards: ${{ steps.pick.outputs.shards }}
      nshards: ${{ steps.pick.outputs.nshards }}
    steps:
      - id: pick
        shell: bash
        env:
          CHOICE: ${{ inputs.os || 'ubuntu-latest' }}
          # The same shard count as a whole sweep in selftest.yml
          # (FULL_SHARDS there; the reason is there).
          NSHARDS: 96
        run: |
          echo "nshards=$NSHARDS" >> "$GITHUB_OUTPUT"
          echo "shards=$(python3 -c "import json,sys; print(json.dumps(list(range(int(sys.argv[1])))))" "$NSHARDS")" >> "$GITHUB_OUTPUT"
          case "$CHOICE" in
            both) echo 'oses=["ubuntu-latest","windows-latest"]' >> "$GITHUB_OUTPUT" ;;
            *)    echo "oses=[\"$CHOICE\"]" >> "$GITHUB_OUTPUT" ;;
          esac

  sweep:
    needs: plan
    strategy:
      fail-fast: false
      # 16 of the account's 20 job slots at most, whatever the OS choice:
      # max-parallel counts every combination of the matrix.
      max-parallel: 16
      matrix:
        os: ${{ fromJSON(needs.plan.outputs.oses) }}
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    runs-on: ${{ matrix.os }}
    # The same limits as selftest.yml's mutate job (the reason is there).
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/workflows/weekly-mutate.yml
      - run: python -m pip install numpy zstandard tzdata pillow
      - id: sweep
        shell: bash
        timeout-minutes: 340
        run: python -u mutate.py --shard ${{ matrix.shard }}/${{ needs.plan.outputs.nshards }} --expected mutate_expected_misses.txt --hints mutate_catchers.json --jobs ${{ matrix.os == 'ubuntu-latest' && 3 || 1 }} 2>&1 | tee "$RUNNER_TEMP/mutate.log"
      - name: Report a shard that ran out of time
        if: always() && steps.sweep.outcome != 'success'
        shell: bash
        env:
          SHARD: ${{ matrix.shard }}
          N: ${{ needs.plan.outputs.nshards }}
          LOG: ${{ runner.temp }}/mutate.log
        run: |
          python - <<'PY'
          import ast, os

          shard, total = int(os.environ["SHARD"]), int(os.environ["N"])
          log = []
          try:
              with open(os.environ["LOG"], encoding="utf-8", errors="replace") as fh:
                  log = [l.rstrip("\r\n") for l in fh]
          except OSError:
              pass
          if any(l.startswith("caught ") and ", missed " in l for l in log):
              print("the sweep finished; any failure is in its own lines above")
              raise SystemExit(0)
          if any("The suite FAILS with nothing mutated" in l for l in log):
              print("the baseline failed; that is not a timeout")
              raise SystemExit(0)
          if any(l.startswith("INFRASTRUCTURE FAILURE") for l in log):
              print("the unmutated suite did not finish, twice: an infrastructure failure, said above")
              raise SystemExit(0)
          tree = ast.parse(open("mutate.py", encoding="utf-8").read(), "mutate.py")
          names = None
          for node in ast.walk(tree):
              if isinstance(node, ast.Assign) and any(
                      isinstance(t, ast.Name) and t.id == "MUTATIONS" for t in node.targets):
                  names = [e.elts[0].value for e in node.value.elts]
          mine = [n for i, n in enumerate(names) if i % total == shard]
          done = set()
          for l in log:
              for pre in ("  caught      ", "  NOT CAUGHT  "):
                  if l.startswith(pre):
                      done.add(l[len(pre):])
              if l.startswith("  SETUP FAIL  "):
                  done.add(l[len("  SETUP FAIL  "):].split(" (pattern", 1)[0])
          todo = [n for n in mine if n not in done]
          if not todo:
              print("no mutation is missing a result; the shard stopped some other way")
              raise SystemExit(0)
          head = (f"shard {shard}/{total} TIMED OUT, it did not finish: "
                  f"{len(todo)} of its {len(mine)} mutations did not run to a result. "
                  "This is a timeout, not a missed mutation; re-run the shard.")
          esc = lambda s: s.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print("::error title=mutate shard timed out::" + esc(head + " Not run: " + " | ".join(todo))[:3500])
          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
              with open(summary, "a", encoding="utf-8") as fh:
                  fh.write("### " + head + "\n\n" + "\n".join("- " + n for n in todo) + "\n")
          print(head)
          for n in todo:
              print("  did not run  " + n)
          raise SystemExit(1)
          PY
      # The whole shard log, kept a week, on the run page under Artifacts.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutate-log-${{ matrix.os }}-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/mutate.log
          retention-days: 7
          if-no-files-found: ignore

  # Which shards are red, with a link to each, in the run's summary and in
  # an issue (opened, or added to) so a red sweep is never silent; a green
  # sweep closes the issue.
  # Always runs: a skipped, cancelled or missing shard is red, never quiet.
  report:
    needs: [plan, sweep]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      issues: write
      contents: read
    steps:
      - uses: actions/checkout@v5
      - name: Say which shards are red, in the summary
        id: table
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          JOB_PREFIX: "sweep ("
          NSHARDS: ${{ needs.plan.outputs.nshards }}
          OSES: ${{ needs.plan.outputs.oses }}
          SWEEP: ${{ needs.sweep.result }}
        run: |
          gh api --paginate "repos/$REPO/actions/runs/$RUN_ID/jobs?per_page=100" \
            --jq '.jobs[] | [.name, (.conclusion // .status), .html_url] | @tsv' > "$RUNNER_TEMP/jobs.tsv"
          python3 - "$RUNNER_TEMP/jobs.tsv" "$RUNNER_TEMP/report.md" <<'PY'
          import json, os, sys

          prefix = os.environ["JOB_PREFIX"]
          shards = []
          with open(sys.argv[1], encoding="utf-8") as fh:
              for line in fh:
                  parts = line.rstrip("\n").split("\t")
                  if len(parts) == 3 and parts[0].startswith(prefix):
                      shards.append(parts)
          red = [s for s in shards if s[1] != "success"]
          # Every shard the plan asked for must be here and green: one that
          # never got a job, or a sweep that was cancelled, is red too.
          try:
              want = int(os.environ.get("NSHARDS") or 0) * len(json.loads(os.environ.get("OSES") or "[]"))
          except ValueError:
              want = 0
          if shards and want > len(shards):
              red.append((f"{want - len(shards)} of the {want} shards", "no job", os.environ["RUN_URL"]))
          if os.environ.get("SWEEP") != "success" and shards and not red:
              red.append(("the sweep", os.environ.get("SWEEP") or "unknown", os.environ["RUN_URL"]))
          out = []
          if not shards:
              out.append("### weekly mutate: no shard jobs were found in this run")
              red = [("(no shards)", "missing", os.environ["RUN_URL"])]
          elif not red:
              out.append(f"### weekly mutate: all {len(shards)} shards green")
          else:
              out += [f"### weekly mutate: {len(red)} of {len(shards)} shards red", "",
                      "| shard | result | job |", "|---|---|---|"]
              out += [f"| {n} | {c} | [open]({u}) |" for n, c, u in red]
              out += ["",
                      "Each red shard's own summary (under its job) says "
                      "why: the kind of failure and the mutation or test. Its "
                      "annotations say the same, and its full log is the "
                      "artifact named `mutate-log-<os>-shard-<n>`, kept 7 days. "
                      "TESTING.md says what each kind of failure means and what "
                      "to do about it."]
          text = "\n".join(out) + "\n"
          print(text)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as fh:
              fh.write(text)
          with open(sys.argv[2], "w", encoding="utf-8") as fh:
              fh.write(text)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"red={len(red)}\n")
          PY
      # Red (no shard at all counts as red): open or add to the
      # mutate-sweep issue and fail. Green: close it.
      - name: Say it in an issue when red
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          RED: ${{ steps.table.outputs.red }}
        if: always()
        run: |
          [[ -f "$RUNNER_TEMP/report.md" ]] || echo "### the shard table could not be made" > "$RUNNER_TEMP/report.md"
          bash .github/scripts/sweep_issue.sh "The weekly mutation sweep of $GITHUB_REF_NAME" "$RUNNER_TEMP/report.md" "${RED:-1}"
